<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港鐵即時到站時間</title>
  <style>
    /* 全局樣式：黑色主題 */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    /* 卡片容器 */
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* 頂部標題與按鈕 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .station-title {
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-fav { background-color: #2e7d32; color: white; }
    .btn-del { background-color: #d32f2f; color: white; }

    /* 路線篩選器 (Filter Bar) */
    .filter-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px dashed #333;
      padding-bottom: 12px;
    }

    .filter-btn {
      background-color: #2c2c2c;
      color: #888;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background-color: #444;
      color: #fff;
    }

    /* 列車清單列表 */
    .train-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .train-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 500;
    }

    .train-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 路線 Badge 樣式 */
    .line-tag {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      min-width: 65px;
      text-align: center;
      color: white;
    }
    .line-tag.KTL { background-color: #00AF41; } /* 觀塘線 綠色 */
    .line-tag.TKL { background-color: #7D499D; } /* 將軍澳線 紫色 */
    .line-tag.ISL { background-color: #007DC5; } /* 港島線 藍色 */
    .line-tag.TWL { background-color: #E60012; } /* 荃灣線 紅色 */

    /* 月台數字圖標 (藍底圓圈) */
    .platform-badge {
      background-color: #1976D2;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    /* 車站名稱 */
    .dest-name {
      color: #ffffff;
      font-size: 17px;
    }

    /* 到達時間 */
    .time-text {
      font-weight: bold;
      color: #2e7d32; /* 綠色數字 */
    }
    .time-text.arriving {
      color: #ff9800; /* 即將抵達 橙色 */
    }

    /* 載入中狀態 */
    .loading {
      text-align: center;
      color: #888;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="station-title">
        <span>🚄</span>
        <span id="station-name-display">載入中...</span>
      </div>
      <div>
        <button class="action-btn btn-fav">收藏</button>
        <button class="action-btn btn-del">刪除</button>
      </div>
    </div>

    <!-- 動態篩選按鈕區塊 -->
    <div class="filter-container" id="filter-container"></div>

    <!-- 列車資料清單 -->
    <div class="train-list" id="train-list">
      <div class="loading">正在擷取即時班次數據...</div>
    </div>
  </div>

  <script>
    // 1. 車站與路線全中文對照字典 (已覆蓋將軍澳線全線及常見轉車站)
    const LINE_NAMES = {
      TKL: '將軍澳線',
      KTL: '觀塘線',
      ISL: '港島線',
      TWL: '荃灣線'
    };

    const STATIONS = {
      // 轉車站（宣告多條路線）
      TIK: { name: '調景嶺', lines: ['TKL', 'KTL'] },
      YAT: { name: '油塘', lines: ['TKL', 'KTL'] },
      NOP: { name: '北角', lines: ['TKL', 'ISL'] },
      QUB: { name: '鰂魚涌', lines: ['TKL', 'ISL'] },
      
      // 將軍澳線
      TKO: { name: '將軍澳', lines: ['TKL'] },
      LHP: { name: '康城', lines: ['TKL'] },
      POA: { name: '寶琳', lines: ['TKL'] },
      HAH: { name: '坑口', lines: ['TKL'] },

      // 觀塘線/其他常見端點與轉車站中文名稱映射
      WHA: { name: '黃埔', lines: ['KTL'] },
      HOM: { name: '何文田', lines: ['KTL'] },
      YMT: { name: '油麻地', lines: ['KTL'] },
      MON: { name: '旺角', lines: ['KTL'] },
      PRE: { name: '太子', lines: ['KTL'] },
      KWT: { name: '觀塘', lines: ['KTL'] },
      CEN: { name: '中環', lines: ['TWL', 'ISL'] },
      ADM: { name: '金鐘', lines: ['TWL', 'ISL'] },
      TST: { name: '尖沙咀', lines: ['TWL'] }
    };

    // 當前選取的車站 (可改為 'LHP' 測試康城，或 'TIK' 測試調景嶺)
    const currentStationCode = 'TIK';
    let currentFilter = 'ALL';
    let rawTrainData = [];

    // 2. API 抓取邏輯 (解決康城站無數據與多路線合併問題)
    async function fetchMTRData(stationCode) {
      const station = STATIONS[stationCode];
      if (!station) return [];

      let allSchedules = [];

      // 針對該車站擁有的所有路線進行查詢
      for (const lineCode of station.lines) {
        const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${lineCode}&sta=${stationCode}`;
        
        try {
          const response = await fetch(url);
          const result = await response.json();

          if (result.status === 1 && result.data[`${lineCode}-${stationCode}`]) {
            const dataObj = result.data[`${lineCode}-${stationCode}`];

            // 同時讀取 UP (上行) 及 DOWN (下行)，避免康城站等單向端點資料遺漏
            ['UP', 'DOWN'].forEach(dir => {
              if (Array.isArray(dataObj[dir])) {
                dataObj[dir].forEach(train => {
                  allSchedules.push({
                    lineCode: lineCode,
                    lineName: LINE_NAMES[lineCode] || lineCode,
                    plat: train.plat,
                    // 中文站名轉換：若字典不存在則備用顯示原始代碼
                    destName: STATIONS[train.dest] ? STATIONS[train.dest].name : train.dest,
                    ttnt: parseInt(train.ttnt, 10),
                    timeText: (train.ttnt === '0' || train.ttnt === '1') ? '即將抵達' : `${train.ttnt} 分鐘`
                  });
                });
              }
            });
          }
        } catch (err) {
          console.error(`讀取 ${lineCode}-${stationCode} 失敗:`, err);
        }
      }

      // 按照到達剩餘時間（分鐘）從小到大排序
      allSchedules.sort((a, b) => a.ttnt - b.ttnt);
      return allSchedules;
    }

    // 3. 渲染轉車站動態按鈕
    function renderFilterButtons(stationCode) {
      const station = STATIONS[stationCode];
      const filterContainer = document.getElementById('filter-container');
      filterContainer.innerHTML = '';

      // 如果該站只有 1 條路線，隱藏篩選列
      if (station.lines.length <= 1) return;

      // 1. 全部路線按鈕
      const allBtn = document.createElement('button');
      allBtn.className = `filter-btn ${currentFilter === 'ALL' ? 'active' : ''}`;
      allBtn.innerText = '全部路線';
      allBtn.onclick = () => {
        currentFilter = 'ALL';
        updateUI();
      };
      filterContainer.appendChild(allBtn);

      // 2. 個別路線按鈕 (例如: 將軍澳線, 觀塘線)
      station.lines.forEach(lineCode => {
        const btn = document.createElement('button');
        btn.className = `filter-btn ${currentFilter === lineCode ? 'active' : ''}`;
        btn.innerText = LINE_NAMES[lineCode] || lineCode;
        btn.onclick = () => {
          currentFilter = lineCode;
          updateUI();
        };
        filterContainer.appendChild(btn);
      });
    }

    // 4. 更新 UI 介面
    function updateUI() {
      // 更新按鈕 active 狀態
      renderFilterButtons(currentStationCode);

      // 篩選資料
      const filteredData = rawTrainData.filter(item => {
        if (currentFilter === 'ALL') return true;
        return item.lineCode === currentFilter;
      });

      const listContainer = document.getElementById('train-list');
      listContainer.innerHTML = '';

      if (filteredData.length === 0) {
        listContainer.innerHTML = '<div class="loading">現時沒有相關班次資料</div>';
        return;
      }

      // 繪製列表
      filteredData.forEach(train => {
        const row = document.createElement('div');
        row.className = 'train-row';

        const isArriving = train.ttnt <= 1;

        row.innerHTML = `
          <div class="train-info-left">
            <span class="line-tag ${train.lineCode}">${train.lineName}</span>
            <span class="platform-badge">${train.plat}</span>
            <span class="dest-name">${train.destName}</span>
          </div>
          <div class="time-text ${isArriving ? 'arriving' : ''}">${train.timeText}</div>
        `;
        listContainer.appendChild(row);
      });
    }

    // 5. 初始化執行
    async function init() {
      const station = STATIONS[currentStationCode];
      document.getElementById('station-name-display').innerText = `${station.name}站`;

      // 抓取 API 資料並渲染
      rawTrainData = await fetchMTRData(currentStationCode);
      updateUI();
    }

    init();
  </script>
</body>
</html>
