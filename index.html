<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港公共交通到站預報系統</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 15px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      background-color: #e9ecef;
      border-bottom: 2px solid #dee2e6;
    }

    .tab-button {
      flex: 1;
      max-width: 200px;
      padding: 12px 20px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #495057;
      transition: all 0.3s;
    }

    .tab-button.active {
      color: var(--primary-color);
      border-bottom: 4px solid var(--primary-color);
      background-color: #fff;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .control-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 15px;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .filter-btn {
      padding: 8px 15px;
      border: 1px solid var(--primary-color);
      background-color: #fff;
      color: var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter-btn.active {
      background-color: var(--primary-color);
      color: #fff;
    }

    .line-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 6px solid #ccc;
    }

    .direction-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .direction-box {
      background-color: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }

    .direction-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #ddd;
    }

    .eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #e0e0e0;
    }

    .eta-item:last-child {
      border-bottom: none;
    }

    .platform-tag {
      background: #6c757d;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .eta-time {
      font-size: 18px;
      font-weight: bold;
      color: #d9534f;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      color: white;
      border-radius: 4px;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h2>香港公共交通到站預報系統</h2>
  </header>

  <div class="nav-tabs">
    <button class="tab-button active" onclick="switchTab('bus-page')">🚌 巴士到站預報</button>
    <button class="tab-button" onclick="switchTab('mtr-page')">🚇 港鐵到站預報</button>
  </div>

  <div class="container">
    
    <!-- 巴士到站預報頁面 (完全保留原始邏輯結構) -->
    <div id="bus-page" class="page active">
      <div class="control-panel">
        <h3>九巴 / 龍運到站預報</h3>
        <div class="form-group">
          <label for="bus-route-input">輸入路線號碼：</label>
          <input type="text" id="bus-route-input" placeholder="例如: 1A, 290, 603" value="1A">
        </div>
        <button onclick="searchBusRoute()">搜尋路線</button>
        
        <div class="form-group" style="margin-top: 15px;">
          <label for="bus-dir-select">選擇方向：</label>
          <select id="bus-dir-select" onchange="loadBusStops()">
            <option value="">-- 請先搜尋路線 --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="bus-stop-select">選擇車站：</label>
          <select id="bus-stop-select" onchange="fetchBusETA()">
            <option value="">-- 請先選擇方向 --</option>
          </select>
        </div>
      </div>

      <div id="bus-eta-result" class="line-card" style="border-left-color: #d9534f;">
        <h3>到站班次資訊</h3>
        <div id="bus-eta-list">請選擇路線及車站以獲取資料資訊。</div>
      </div>
    </div>

    <!-- 港鐵到站預報頁面 (完整優化版本) -->
    <div id="mtr-page" class="page">
      <div class="control-panel">
        <h3>港鐵列車到站預報</h3>
        <div class="form-group">
          <label for="mtr-station-select">選擇港鐵車站：</label>
          <select id="mtr-station-select" onchange="handleMTRStationChange()">
            <!-- 動態載入車站選單 -->
          </select>
        </div>

        <!-- 轉車站路線動態篩選按鈕列 -->
        <div id="mtr-filter-container" style="display: none;">
          <label>路線篩選（轉車站）：</label>
          <div id="mtr-line-filters" class="filter-group"></div>
        </div>
      </div>

      <div id="mtr-eta-results">
        <!-- 動態顯示港鐵班次結果 -->
      </div>
    </div>

  </div>

  <script>
    /* ===================================================
       1. 分頁切換邏輯
       =================================================== */
    function switchTab(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));

      document.getElementById(pageId).classList.add('active');
      event.target.classList.add('active');
    }

    /* ===================================================
       2. 巴士頁面邏輯 (完整九巴 API 介接)
       =================================================== */
    let currentBusStops = [];

    async function searchBusRoute() {
      const route = document.getElementById('bus-route-input').value.trim().toUpperCase();
      if (!route) return alert('請輸入路線號碼');

      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/outbound/1`);
        const dirSelect = document.getElementById('bus-dir-select');
        dirSelect.innerHTML = '';

        if (res.ok) {
          const data = await res.json();
          if (data.data) {
            dirSelect.innerHTML += `<option value="outbound">往 ${data.data.dest_tc}</option>`;
          }
        }

        const resIn = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${route}/inbound/1`);
        if (resIn.ok) {
          const dataIn = await resIn.json();
          if (dataIn.data) {
            dirSelect.innerHTML += `<option value="inbound">往 ${dataIn.data.dest_tc}</option>`;
          }
        }

        if (dirSelect.options.length === 0) {
          alert('找不到該路線資料');
          return;
        }

        loadBusStops();
      } catch (err) {
        alert('獲取巴士路線失敗：' + err.message);
      }
    }

    async function loadBusStops() {
      const route = document.getElementById('bus-route-input').value.trim().toUpperCase();
      const dir = document.getElementById('bus-dir-select').value;
      if (!route || !dir) return;

      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/${dir}/1`);
        const data = await res.json();
        const stopSelect = document.getElementById('bus-stop-select');
        stopSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>';
        currentBusStops = data.data || [];

        for (let i = 0; i < currentBusStops.length; i++) {
          const stopDetail = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${currentBusStops[i].stop}`);
          const stopData = await stopDetail.json();
          const stopName = stopData.data ? stopData.data.name_tc : currentBusStops[i].stop;
          stopSelect.innerHTML += `<option value="${currentBusStops[i].stop}">${i + 1}. ${stopName}</option>`;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchBusETA() {
      const route = document.getElementById('bus-route-input').value.trim().toUpperCase();
      const stopId = document.getElementById('bus-stop-select').value;
      if (!stopId) return;

      const container = document.getElementById('bus-eta-list');
      container.innerHTML = '載入中...';

      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/1`);
        const data = await res.json();
        const etas = data.data || [];

        if (etas.length === 0) {
          container.innerHTML = '暫無到站班次資料';
          return;
        }

        container.innerHTML = etas.slice(0, 3).map(e => {
          const timeStr = e.eta ? new Date(e.eta).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '未有資料';
          const rmk = e.rmk_tc ? `(${e.rmk_tc})` : '';
          return `
            <div class="eta-item">
              <span>往 ${e.dest_tc} ${rmk}</span>
              <span class="eta-time">${timeStr}</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '獲取到站時間失敗';
      }
    }

    /* ===================================================
       3. 港鐵頁面邏輯 (完整實作雙向、終點站與轉車站篩選)
       =================================================== */
    const MTR_LINES = {
      KTL: {
        name: "觀塘綫", color: "#00AF41",
        upTerm: "調景嶺", dnTerm: "黃埔",
        stations: [
          { code: "WHA", name: "黃埔", isTerminal: "DN" },
          { code: "HOM", name: "何文田" },
          { code: "YMT", name: "油麻地" },
          { code: "MOK", name: "旺角" },
          { code: "PRE", name: "太子" },
          { code: "SKM", name: "石硤尾" },
          { code: "KOT", name: "九龍塘" },
          { code: "LOF", name: "樂富" },
          { code: "WTS", name: "黃大仙" },
          { code: "DIH", name: "鑽石山" },
          { code: "CHH", name: "彩虹" },
          { code: "KOB", name: "九龍灣" },
          { code: "NTK", name: "牛頭角" },
          { code: "KWT", name: "觀塘" },
          { code: "LAT", name: "藍田" },
          { code: "YAT", name: "油塘" },
          { code: "TIK", name: "調景嶺", isTerminal: "UP" }
        ]
      },
      TML: {
        name: "屯馬綫", color: "#9A3820",
        upTerm: "烏溪沙", dnTerm: "屯門",
        stations: [
          { code: "TUM", name: "屯門", isTerminal: "DN" },
          { code: "SIH", name: "兆康" }, { code: "TIS", name: "天水圍" },
          { code: "LOP", name: "朗屏" }, { code: "YUL", name: "元朗" },
          { code: "KSR", name: "錦上路" }, { code: "TWW", name: "荃灣西" },
          { code: "MEF", name: "美孚" }, { code: "NAC", name: "南昌" },
          { code: "AUS", name: "柯士甸" }, { code: "ETS", name: "尖東" },
          { code: "HUN", name: "紅磡" }, { code: "HOM", name: "何文田" },
          { code: "TKW", name: "土瓜灣" }, { code: "SUW", name: "宋皇臺" },
          { code: "KAT", name: "啟德" }, { code: "DIH", name: "鑽石山" },
          { code: "HIK", name: "顯徑" }, { code: "TAW", name: "大圍" },
          { code: "CKT", name: "車公廟" }, { code: "STW", name: "沙田圍" },
          { code: "CIO", name: "第一城" }, { code: "SHM", name: "石門" },
          { code: "TSH", name: "大水坑" }, { code: "HEO", name: "恒安" },
          { code: "MOS", name: "馬鞍山" }, { code: "WKS", name: "烏溪沙", isTerminal: "UP" }
        ]
      },
      TWL: {
        name: "荃灣綫", color: "#E60012",
        upTerm: "荃灣", dnTerm: "中環",
        stations: [
          { code: "CEN", name: "中環", isTerminal: "DN" },
          { code: "ADM", name: "金鐘" }, { code: "TST", name: "尖沙咀" },
          { code: "JOR", name: "佐敦" }, { code: "YMT", name: "油麻地" },
          { code: "MOK", name: "旺角" }, { code: "PRE", name: "太子" },
          { code: "SSP", name: "深水埗" }, { code: "CSW", name: "長沙灣" },
          { code: "LCK", name: "荔枝角" }, { code: "MEF", name: "美孚" },
          { code: "LAK", name: "荔景" }, { code: "KWF", name: "葵芳" },
          { code: "KHI", name: "葵興" }, { code: "TWH", name: "大窩口" },
          { code: "TSW", name: "荃灣", isTerminal: "UP" }
        ]
      },
      ISL: {
        name: "港島綫", color: "#007DC3",
        upTerm: "柴灣", dnTerm: "堅尼地城",
        stations: [
          { code: "KET", name: "堅尼地城", isTerminal: "DN" },
          { code: "HKU", name: "香港大學" }, { code: "SYP", name: "西營盤" },
          { code: "SHW", name: "上環" }, { code: "CEN", name: "中環" },
          { code: "ADM", name: "金鐘" }, { code: "WAC", name: "灣仔" },
          { code: "CAB", name: "銅鑼灣" }, { code: "TIH", name: "天后" },
          { code: "FOH", name: "炮台山" }, { code: "NOP", name: "北角" },
          { code: "QUB", name: "鰂魚涌" }, { code: "TAK", name: "太古" },
          { code: "SWH", name: "西灣河" }, { code: "SKW", name: "筲箕灣" },
          { code: "HFC", name: "杏花邨" }, { code: "CHW", name: "柴灣", isTerminal: "UP" }
        ]
      }
    };

    let selectedMTRFilter = 'ALL';

    function initMTRStations() {
      const select = document.getElementById('mtr-station-select');
      const uniqueStations = new Map();

      // 歸納所有不重複車站名稱與代碼
      for (const lineKey in MTR_LINES) {
        MTR_LINES[lineKey].stations.forEach(s => {
          if (!uniqueStations.has(s.code)) {
            uniqueStations.set(s.code, s.name);
          }
        });
      }

      select.innerHTML = '';
      uniqueStations.forEach((name, code) => {
        select.innerHTML += `<option value="${code}">${name} (${code})</option>`;
      });

      // 預設選擇「鑽石山 (DIH)」作為展示範例
      select.value = 'DIH';
      handleMTRStationChange();
    }

    function handleMTRStationChange() {
      const staCode = document.getElementById('mtr-station-select').value;
      const connectedLines = Object.keys(MTR_LINES).filter(lineKey => 
        MTR_LINES[lineKey].stations.some(s => s.code === staCode)
      );

      const filterContainer = document.getElementById('mtr-filter-container');
      const filterGroup = document.getElementById('mtr-line-filters');

      // 需求 3: 若為轉車站，產生路線篩選按鈕 (全部 / 各條路線)
      if (connectedLines.length > 1) {
        filterContainer.style.display = 'block';
        let filterHTML = `<button class="filter-btn ${selectedMTRFilter==='ALL'?'active':''}" onclick="setMTRFilter('ALL')">全部</button>`;
        connectedLines.forEach(l => {
          filterHTML += `<button class="filter-btn ${selectedMTRFilter===l?'active':''}" onclick="setMTRFilter('${l}')">${MTR_LINES[l].name}</button>`;
        });
        filterGroup.innerHTML = filterHTML;
      } else {
        filterContainer.style.display = 'none';
        selectedMTRFilter = 'ALL';
      }

      fetchMTRETA(staCode, connectedLines);
    }

    function setMTRFilter(lineKey) {
      selectedMTRFilter = lineKey;
      handleMTRStationChange();
    }

    async function fetchMTRETA(staCode, connectedLines) {
      const resultsContainer = document.getElementById('mtr-eta-results');
      resultsContainer.innerHTML = '資料載入中...';

      let targetLines = connectedLines;
      if (selectedMTRFilter !== 'ALL') {
        targetLines = targetLines.filter(l => l === selectedMTRFilter);
      }

      let htmlContent = '';

      for (const lineKey of targetLines) {
        const lineData = MTR_LINES[lineKey];
        const stationObj = lineData.stations.find(s => s.code === staCode);

        try {
          const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${lineKey}&sta=${staCode}`);
          const data = await res.json();
          const schedule = data.data?.[`${lineKey}-${staCode}`] || {};

          htmlContent += `
            <div class="line-card" style="border-left-color: ${lineData.color}">
              <h3>
                ${lineData.name} - ${stationObj.name} 
                <span class="badge" style="background:${lineData.color}">${lineKey}</span>
              </h3>
              <div class="direction-grid">
          `;

          // 需求 1 & 2: 判斷終點站與顯示雙向班次
          const isUpTerminal = stationObj.isTerminal === 'UP';
          const isDnTerminal = stationObj.isTerminal === 'DN';

          // UP 方向 (往 UP 終點站)
          if (!isUpTerminal) {
            let upTrains = schedule.UP || [];
            // 需求 2: 若該站為終點站，最多只顯示 4 個班次
            if (isDnTerminal) upTrains = upTrains.slice(0, 4);

            htmlContent += renderDirectionBox(`往 ${lineData.upTerm}`, upTrains);
          }

          // DN 方向 (往 DN 終點站)
          if (!isDnTerminal) {
            let dnTrains = schedule.DN || [];
            // 需求 2: 若該站為終點站，最多只顯示 4 個班次
            if (isUpTerminal) dnTrains = dnTrains.slice(0, 4);

            htmlContent += renderDirectionBox(`往 ${lineData.dnTerm}`, dnTrains);
          }

          htmlContent += `</div></div>`;

        } catch (err) {
          htmlContent += `<div class="line-card">獲取 ${lineData.name} 資料時發生錯誤</div>`;
        }
      }

      resultsContainer.innerHTML = htmlContent || '無符合資料';
    }

    function renderDirectionBox(dirTitle, trains) {
      let boxHTML = `
        <div class="direction-box">
          <div class="direction-title">${dirTitle}</div>
      `;

      if (!trains || trains.length === 0) {
        boxHTML += `<div>暫無列車班次資訊</div>`;
      } else {
        trains.forEach(t => {
          const min = t.ttnt === '0' ? '即將到達' : `${t.ttnt} 分鐘`;
          boxHTML += `
            <div class="eta-item">
              <span>月台 <span class="platform-tag">${t.plat}</span> (往 ${t.dest})</span>
              <span class="eta-time">${min}</span>
            </div>
          `;
        });
      }

      boxHTML += `</div>`;
      return boxHTML;
    }

    // 初始化港鐵車站選單
    window.onload = () => {
      initMTRStations();
    };
  </script>
</body>
</html>
