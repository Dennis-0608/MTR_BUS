<!-- 將 HTML 中的 mtrViewContainer 替換為以下完整的港鐵介面與邏輯 -->

<div id="mtrViewContainer" class="flex-1 flex flex-col gap-2 min-h-0 overflow-hidden hidden">
    <!-- 港鐵路線與車站選擇器 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col gap-2.5 shrink-0">
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-train-subway text-purple-400"></i>
                <span>港鐵即時到站預報</span>
            </h2>
            <span class="text-[10px] bg-purple-900/50 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full font-semibold">全中文介面</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
            <!-- 路線選擇 -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1 font-bold">選擇路線：</label>
                <select id="mtrLineSelect" onchange="onMtrLineChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-purple-500">
                    <option value="">-- 請選擇港鐵路線 --</option>
                    <option value="KTL">觀塘綫</option>
                    <option value="ISL">港島綫</option>
                    <option value="TWL">荃灣綫</option>
                    <option value="TKL">將軍澳綫</option>
                    <option value="TML">屯馬綫</option>
                    <option value="EAL">東鐵綫</option>
                    <option value="TCL">東涌綫</option>
                    <option value="SIL">南港島綫</option>
                    <option value="AEL">機場快綫</option>
                    <option value="DRL">迪士尼綫</option>
                </select>
            </div>

            <!-- 車站選擇 -->
            <div>
                <label class="block text-[11px] text-slate-400 mb-1 font-bold">選擇車站：</label>
                <select id="mtrStationSelect" onchange="onMtrStationChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-purple-500">
                    <option value="">-- 請先選擇路線 --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 港鐵到站時間顯示區 -->
    <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col overflow-hidden min-h-0">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2 shrink-0">
            <h3 id="mtrDisplayTitle" class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                <i class="fa-regular fa-clock text-purple-400"></i>
                <span>到站班次資訊</span>
            </h3>
            <button onclick="fetchMtrETA()" class="p-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition text-[11px]">
                <i id="mtrRefreshIcon" class="fa-solid fa-rotate-right mr-1"></i>更新
            </button>
        </div>

        <div id="mtrEtaListContainer" class="flex-1 flex flex-col justify-start gap-2 overflow-y-auto no-scrollbar py-0.5">
            <div class="text-center py-10 text-slate-500">
                <i class="fa-solid fa-train-subway text-3xl mb-2 block text-slate-700"></i>
                <p class="text-xs">請在上欄選擇港鐵路線及車站</p>
            </div>
        </div>
    </div>
</div>

<script>
// 港鐵全路線與中文車站對照資料庫 (專用，不干涉巴士數據)
const mtrData = {
    "KTL": { name: "觀塘綫", stations: { "WHA": "黃埔", "HOM": "何文田", "YMT": "油麻地", "MOK": "旺角", "PRE": "太子", "SKM": "石硤尾", "KOT": "九龍塘", "LOF": "樂富", "WTA": "黃大仙", "DIH": "鑽石山", "CHH": "彩虹", "KOB": "九龍灣", "NTK": "牛頭角", "KWT": "觀塘", "LAT": "藍田", "YAT": "油塘", "TIK": "調景嶺" } },
    "ISL": { name: "港島綫", stations: { "KET": "堅尼地城", "HKU": "香港大學", "SYP": "西營盤", "SHW": "上環", "CEN": "中環", "ADM": "金鐘", "WAC": "灣仔", "CAB": "銅鑼灣", "TIH": "天后", "FOH": "炮台山", "NOP": "北角", "QUB": "鰂魚湧", "TAK": "太古", "SWH": "西灣河", "SKW": "筲箕灣", "HFC": "杏花邨", "CHW": "柴灣" } },
    "TWL": { name: "荃灣綫", stations: { "CEN": "中環", "ADM": "金鐘", "TST": "尖沙咀", "JOR": "佐敦", "YMT": "油麻地", "MOK": "旺角", "PRE": "太子", "SSP": "深水埗", "CSW": "長沙灣", "LCK": "荔枝角", "MEFO": "美孚", "LAK": "荔景", "KWF": "葵芳", "KWO": "葵興", "TWH": "大窩口", "TSW": "荃灣" } },
    "TKL": { name: "將軍澳綫", stations: { "NOP": "北角", "QUB": "鰂魚湧", "YAT": "油塘", "TIK": "調景嶺", "TKO": "將軍澳", "LHA": "康城", "HAH": "坑口", "POA": "寶琳" } },
    "TML": { name: "屯馬綫", stations: { "TUM": "屯門", "54D": "兆康", "TIS": "天水圍", "LOP": "朗屏", "YUL": "元朗", "KSR": "錦上路", "TWW": "荃灣西", "MEF": "美孚", "NAC": "南昌", "AUS": "柯士甸", "ETS": "尖東", "HOM": "何文田", "TKW": "土瓜灣", "SUW": "宋皇臺", "KAT": "啟德", "DIH": "鑽石山", "HIK": "顯徑", "TAW": "大圍", "CKT": "車公廟", "STW": "沙田圍", "CIO": "第一城", "STO": "石門", "TSH": "亞公角", "HEO": "恆安", "MOS": "馬鞍山", "WHA2": "烏溪沙" } },
    "EAL": { name: "東鐵綫", stations: { "ADM": "金鐘", "EXC": "會展", "MFA": "紅磡", "MOK": "旺角東", "KOT": "九龍塘", "TAW": "大圍", "SHT": "沙田", "FOT": "火炭", "RAC": "馬場", "UNI": "大學", "TAP": "大埔墟", "TWO": "太和", "FAN": "粉嶺", "SHE": "上水", "LOW": "羅湖", "LBU": "落馬洲" } },
    "TCL": { name: "東涌綫", stations: { "HOK": "香港", "KOW": "九龍", "OLY": "奧運", "NAC": "南昌", "LAK": "荔景", "SUN": "欣澳", "TOC": "東涌" } },
    "SIL": { name: "南港島綫", stations: { "ADM": "金鐘", "OCP": "海洋公園", "WCH": "黃竹坑", "LET": "利東", "SOH": "海怡半島" } },
    "AEL": { name: "機場快綫", stations: { "HOK": "香港", "KOW": "九龍", "TSY": "青衣", "AIR": "機場", "AWE": "博覽館" } },
    "DRL": { name: "迪士尼綫", stations: { "SUN": "欣澳", "DIS": "迪士尼" } }
};

let currentMtrLine = '';
let currentMtrStation = '';

// 港鐵路線改變時，動態載入對應中文車站
function onMtrLineChange() {
    const lineSelect = document.getElementById('mtrLineSelect');
    const stationSelect = document.getElementById('mtrStationSelect');
    currentMtrLine = lineSelect.value;
    
    stationSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>';
    
    if (!currentMtrLine || !mtrData[currentMtrLine]) return;

    const stations = mtrData[currentMtrLine].stations;
    for (let code in stations) {
        stationSelect.innerHTML += `<option value="${code}">${stations[code]}</option>`;
    }
}

function onMtrStationChange() {
    currentMtrStation = document.getElementById('mtrStationSelect').value;
    if (currentMtrLine && currentMtrStation) {
        fetchMtrETA();
    }
}

// 讀取港鐵開放數據 API
async function fetchMtrETA() {
    if (!currentMtrLine || !currentMtrStation) return;

    const container = document.getElementById('mtrEtaListContainer');
    const icon = document.getElementById('mtrRefreshIcon');
    if (icon) icon.classList.add('fa-spin');

    container.innerHTML = `
        <div class="text-center py-8 text-purple-400 text-xs">
            <i class="fa-solid fa-spinner fa-spin mr-1.5 text-base"></i>正在下載即時列車到站時間...
        </div>
    `;

    try {
        const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${currentMtrLine}&sta=${currentMtrStation}&lang=TC`;
        const res = await fetch(url);
        const data = await res.json();

        if (icon) icon.classList.remove('fa-spin');

        if (data.status === 0 || !data.data || !data.data[`${currentMtrLine}-${currentMtrStation}`]) {
            container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">暫無即時到站班次資料或已過尾班車時間</div>`;
            return;
        }

        const schedule = data.data[`${currentMtrLine}-${currentMtrStation}`];
        let html = '';

        // 處理往上行 (UP) 與往下行 (DOWN) 方向班次
        ['UP', 'DOWN'].forEach(dir => {
            const trains = schedule[dir];
            if (trains && trains.length > 0) {
                trains.forEach(t => {
                    const destCode = t.dest;
                    // 自動尋找中文目的地名稱
                    const destName = mtrData[currentMtrLine]?.stations[destCode] || destCode;
                    const tt = t.ttnt || '0';
                    const timeStr = t.time ? t.time.split(' ')[1].substring(0, 5) : '--:--';

                    html += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-lg bg-purple-900/60 text-purple-300 font-bold flex items-center justify-center text-xs">往</span>
                                <div>
                                    <h4 class="font-bold text-sm text-slate-100">往 ${destName}</h4>
                                    <p class="text-[10px] text-slate-400">月台 ${t.plat || '--'}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-black text-purple-400">${tt} <span class="text-xs font-normal text-slate-400">分鐘</span></span>
                                <div class="text-[10px] text-slate-500">預計 ${timeStr}</div>
                            </div>
                        </div>
                    `;
                });
            }
        });

        container.innerHTML = html || `<div class="text-center py-8 text-slate-500 text-xs">目前沒有即時列車資訊</div>`;

    } catch (err) {
        if (icon) icon.classList.remove('fa-spin');
        container.innerHTML = `<div class="text-center py-8 text-rose-400 text-xs">數據載入失敗，請稍後重試</div>`;
    }
}
</script>
