<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士到站預報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-base font-black text-emerald-400 tracking-wider">
            <i class="fa-solid fa-bus-simple mr-2"></i>香港巴士到站預報
        </h1>
        <button onclick="openGpsModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-location-crosshairs"></i> GPS 搜尋
        </button>
    </header>

    <main class="flex-1 p-4 max-w-lg mx-auto w-full">
        <div class="text-center py-20 text-slate-500">
            <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-700"></i>
            <p class="text-sm">點擊右上角「GPS 搜尋」以尋找附近的巴士路線與站點</p>
        </div>
    </main>

    <!-- GPS 搜尋結果 Modal / 容器 -->
    <div id="gpsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl flex flex-col max-h-[85vh] shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-compass text-emerald-400"></i> 附近巴士站搜尋
                </h3>
                <button onclick="closeGpsModal()" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-3 bg-slate-950/50 border-b border-slate-800/60 flex items-center gap-2">
                <span class="text-xs text-slate-400">搜尋半徑：</span>
                <select id="gpsRadiusSelect" onchange="changeGpsRadius(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded px-2 py-1 outline-none">
                    <option value="300">300 米</option>
                    <option value="500" selected>500 米</option>
                    <option value="1000">1 公里</option>
                </select>
                <button onclick="executeGpsSearch()" class="ml-auto bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                    重新搜尋
                </button>
            </div>
            <div id="gpsResultsContainer" class="p-4 overflow-y-auto space-y-2.5 flex-1">
                <!-- 結果會動態插入此處 -->
            </div>
        </div>
    </div>

    <script>
        // 全域變數與快取
        let currentGpsRadius = 500;
        let kmbAllStopsCache = null;
        let kmbAllRouteStopsCache = null;
        let ctbAllStopsCache = null;
        let ctbAllRouteStopsCache = null; // 【已修復】城巴路線站點快取
        let isGpsSearching = false;
        
        // 模擬的路線清單與目錄（確保相容性）
        let kmbRoutes = [];
        let ctbRoutes = [];
        let ctbStopsDirectory = new Map();

        function openGpsModal() {
            document.getElementById('gpsModal').classList.remove('hidden');
            if (!isGpsSearching && !kmbAllStopsCache) {
                executeGpsSearch();
            }
        }

        function closeGpsModal() {
            document.getElementById('gpsModal').classList.add('hidden');
        }

        function changeGpsRadius(val) {
            currentGpsRadius = parseInt(val);
            executeGpsSearch();
        }

        // 計算兩點距離 (Haversine formula) 單位：米
        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return Math.round(R * c);
        }

        // 【已修復與全面優化的 GPS 搜尋核心邏輯】
        async function executeGpsSearch() {
            if (isGpsSearching) return;
            isGpsSearching = true;

            const container = document.getElementById('gpsResultsContainer');
            container.innerHTML = `
                <div class="text-center py-10 text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-400 block"></i>
                    <p class="text-xs font-bold text-slate-300">正在擷取 GPS 定位並檢索九巴及城巴全港站點...</p>
                    <p class="text-[10px] text-slate-500 mt-1">請確保已允許瀏覽器存取位置權限</p>
                </div>
            `;

            if (!("geolocation" in navigator)) {
                container.innerHTML = `
                    <div class="text-center py-10 text-rose-400 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>
                        <p>您的裝置不支援 GPS 定位服務</p>
                    </div>
                `;
                isGpsSearching = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    try {
                        // 1. 同步載入九巴及城巴的基礎站點資料
                        if (!kmbAllStopsCache) {
                            const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                            if (res.ok) {
                                const data = await res.json();
                                kmbAllStopsCache = data.data || [];
                            }
                        }

                        if (!kmbAllRouteStopsCache) {
                            const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop');
                            if (res.ok) {
                                const data = await res.json();
                                kmbAllRouteStopsCache = data.data || [];
                            }
                        }

                        if (!ctbAllStopsCache) {
                            const res = await fetch('https://rt.data.gov.hk/v2/transport/citybus/stop/ctb');
                            if (res.ok) {
                                const data = await res.json();
                                ctbAllStopsCache = data.data || [];
                            }
                        }

                        // 【修復核心】：完整取得城巴所有路線的站點關聯，解決原本城巴無法搜尋的問題
                        if (!ctbAllRouteStopsCache) {
                            ctbAllRouteStopsCache = new Map();
                            // 若 ctbRoutes 未初始化，先嘗試抓取城巴路線清單
                            if (!ctbRoutes || ctbRoutes.length === 0) {
                                const rRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/ctb');
                                if (rRes.ok) {
                                    const rData = await rRes.json();
                                    ctbRoutes = rData.data || [];
                                }
                            }

                            if (ctbRoutes && ctbRoutes.length > 0) {
                                const ctbPromises = ctbRoutes.map(async (r) => {
                                    const routeNum = r.route;
                                    try {
                                        const resOut = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${routeNum}/outbound`);
                                        if (resOut.ok) {
                                            const dataOut = await resOut.json();
                                            if (dataOut.data) {
                                                ctbAllRouteStopsCache.set(`${routeNum}_outbound`, dataOut.data);
                                            }
                                        }
                                        const resIn = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${routeNum}/inbound`);
                                        if (resIn.ok) {
                                            const dataIn = await resIn.json();
                                            if (dataIn.data) {
                                                ctbAllRouteStopsCache.set(`${routeNum}_inbound`, dataIn.data);
                                            }
                                        }
                                    } catch (e) {}
                                });
                                await Promise.allSettled(ctbPromises);
                            }
                        }

                        const matchedRouteCandidates = [];
                        const nearbyStopsMap = new Map();

                        // 2. 檢索九巴附近站點
                        if (kmbAllStopsCache) {
                            kmbAllStopsCache.forEach(s => {
                                const lat = parseFloat(s.lat);
                                const lng = parseFloat(s.long);
                                if (!isNaN(lat) && !isNaN(lng)) {
                                    const dist = calculateDistanceMeters(userLat, userLng, lat, lng);
                                    if (dist <= currentGpsRadius) {
                                        nearbyStopsMap.set(s.stop, {
                                            company: 'kmb',
                                            stopId: s.stop,
                                            name: s.name_tc || s.name_en,
                                            distance: dist
                                        });
                                    }
                                }
                            });
                        }

                        // 3. 檢索城巴附近站點
                        if (ctbAllStopsCache) {
                            ctbAllStopsCache.forEach(s => {
                                const lat = parseFloat(s.lat);
                                const lng = parseFloat(s.long);
                                if (!isNaN(lat) && !isNaN(lng)) {
                                    const dist = calculateDistanceMeters(userLat, userLng, lat, lng);
                                    if (dist <= currentGpsRadius) {
                                        ctbStopsDirectory.set(s.stop, s.name_tc || s.name_en);
                                        nearbyStopsMap.set(s.stop, {
                                            company: 'ctb',
                                            stopId: s.stop,
                                            name: s.name_tc || s.name_en,
                                            distance: dist
                                        });
                                    }
                                }
                            });
                        }

                        // 4. 匹配九巴路線與站點
                        if (kmbAllRouteStopsCache) {
                            kmbAllRouteStopsCache.forEach(rs => {
                                if (nearbyStopsMap.has(rs.stop)) {
                                    const stopInfo = nearbyStopsMap.get(rs.stop);
                                    if (stopInfo.company === 'kmb') {
                                        let boundVal = rs.bound;
                                        if (boundVal === 'O') boundVal = 'outbound';
                                        if (boundVal === 'I') boundVal = 'inbound';

                                        const routeVariants = kmbRoutes.filter(r => String(r.route) === String(rs.route));
                                        let destName = '目的車站';
                                        let origName = '';
                                        if (routeVariants.length > 0) {
                                            const matchedVariant = routeVariants.find(v => {
                                                let vBound = v.bound;
                                                if (vBound === 'O') vBound = 'outbound';
                                                if (vBound === 'I') vBound = 'inbound';
                                                return (vBound === boundVal || !v.bound) && String(v.service_type || '1') === String(rs.service_type || '1');
                                            }) || routeVariants[0];

                                            destName = matchedVariant.dest_tc || matchedVariant.dest_en || '目的車站';
                                            origName = matchedVariant.orig_tc || matchedVariant.orig_en || '';
                                        }

                                        matchedRouteCandidates.push({
                                            company: 'kmb',
                                            route: rs.route,
                                            bound: boundVal,
                                            serviceType: rs.service_type || '1',
                                            stopId: rs.stop,
                                            stopName: stopInfo.name,
                                            seq: rs.seq,
                                            dest: destName,
                                            orig: origName,
                                            distance: stopInfo.distance
                                        });
                                    }
                                }
                            });
                        }

                        // 5. 匹配城巴路線與站點
                        if (ctbAllRouteStopsCache) {
                            ctbAllRouteStopsCache.forEach((stopsList, key) => {
                                const underscoreIdx = key.lastIndexOf('_');
                                const routeNum = key.substring(0, underscoreIdx);
                                const boundVal = key.substring(underscoreIdx + 1);

                                stopsList.forEach(rs => {
                                    if (nearbyStopsMap.has(rs.stop)) {
                                        const stopInfo = nearbyStopsMap.get(rs.stop);
                                        if (stopInfo.company === 'ctb') {
                                            const routeVariants = ctbRoutes.filter(r => String(r.route) === String(routeNum));
                                            let destName = '目的車站';
                                            let origName = '';
                                            if (routeVariants.length > 0) {
                                                const v = routeVariants[0];
                                                destName = v.dest_tc || v.dest_en || '目的車站';
                                                origName = v.orig_tc || v.orig_en || '';
                                            }

                                            matchedRouteCandidates.push({
                                                company: 'ctb',
                                                route: routeNum,
                                                bound: boundVal,
                                                serviceType: '1',
                                                stopId: rs.stop,
                                                stopName: stopInfo.name,
                                                seq: rs.seq,
                                                dest: destName,
                                                orig: origName,
                                                distance: stopInfo.distance
                                            });
                                        }
                                    }
                                });
                            });
                        }

                        if (matchedRouteCandidates.length === 0) {
                            container.innerHTML = `
                                <div class="text-center py-10 text-slate-500">
                                    <i class="fa-solid fa-bus-slash text-3xl mb-2 block text-slate-700"></i>
                                    <p class="text-xs font-bold text-slate-300">附近 ${currentGpsRadius} 米內未有找到巴士站點</p>
                                    <p class="text-[10px] text-slate-500 mt-1">請嘗試加大搜尋距離</p>
                                </div>
                            `;
                            isGpsSearching = false;
                            return;
                        }

                        // 6. 整合去重並排序
                        const deduplicatedMap = new Map();
                        matchedRouteCandidates.forEach(item => {
                            const key = `${item.company}_${item.route}_${item.bound}_${item.dest}`;
                            if (!deduplicatedMap.has(key)) {
                                deduplicatedMap.set(key, item);
                            } else {
                                const existing = deduplicatedMap.get(key);
                                if (item.distance < existing.distance) {
                                    deduplicatedMap.set(key, item);
                                }
                            }
                        });

                        const sortedResults = Array.from(deduplicatedMap.values())
                            .sort((a, b) => a.distance - b.distance)
                            .slice(0, 100);

                        container.innerHTML = sortedResults.map(item => {
                            const compBadge = item.company === 'kmb' 
                                ? '<span class="bg-rose-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded shrink-0">九巴</span>' 
                                : '<span class="bg-amber-500 text-slate-950 text-[9px] font-black px-1.5 py-0.5 rounded shrink-0">城巴</span>';

                            const distText = item.distance < 1000 ? `${item.distance} 米` : `${(item.distance / 1000).toFixed(1)} 公里`;

                            return `
                                <div onclick="selectGpsRouteItem('${item.company}', '${item.route}', '${item.bound}', '${item.serviceType}', '${item.stopId}', '${item.stopName.replace(/'/g, "\\'")}', ${item.seq}, '${item.dest.replace(/'/g, "\\'")}', '${item.orig.replace(/'/g, "\\'")}')" class="bg-slate-900 border border-slate-800 hover:border-emerald-500/65 rounded-xl p-2.5 cursor-pointer transition flex items-center justify-between gap-2 shadow-sm active:scale-98">
                                    <div class="flex items-center gap-2 overflow-hidden flex-1">
                                        ${compBadge}
                                        <div class="overflow-hidden">
                                            <div class="flex items-center gap-1.5">
                                                <span class="font-black text-emerald-400 text-sm">${item.route}</span>
                                                <span class="text-xs font-bold text-slate-200 truncate">往 ${item.dest}</span>
                                            </div>
                                            <div class="text-[10px] text-slate-400 truncate mt-0.5">
                                                <i class="fa-solid fa-location-dot text-[9px] text-indigo-400 mr-1"></i>${item.stopName}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <span class="bg-emerald-950/80 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-lg inline-block">
                                            ${distText}
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('');

                    } catch (err) {
                        console.error("GPS search error:", err);
                        container.innerHTML = `
                            <div class="text-center py-10 text-rose-400 text-xs">
                                <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>
                                <p>搜尋附近車站時發生錯誤，請重試</p>
                            </div>
                        `;
                    } finally {
                        isGpsSearching = false;
                    }
                },
                (error) => {
                    isGpsSearching = false;
                    container.innerHTML = `
                        <div class="text-center py-10 text-rose-400 text-xs">
                            <i class="fa-solid fa-location-slash text-2xl mb-2 block text-slate-500"></i>
                            <p class="font-bold">無法存取您的 GPS 位置</p>
                            <p class="text-slate-400 mt-1">請在瀏覽器設定中開啟位置權限後重試</p>
                        </div>
                    `;
                },
                { timeout: 10000, enableHighAccuracy: true, maximumAge: 10000 }
            );
        }

        function selectGpsRouteItem(company, route, bound, serviceType, stopId, stopName, seq, dest, orig) {
            alert(`已選擇: [${company.toUpperCase()}] ${route} 往 ${dest}\n站點: ${stopName}`);
            closeGpsModal();
        }
    </script>
</body>
</html>
