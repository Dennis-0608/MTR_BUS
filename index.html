        function loadFavoriteItem(target) {
            if (typeof target === 'number') {
                if (!favorites[target]) return;
                currentActiveStop = JSON.parse(JSON.stringify(favorites[target]));
            } else if (target && typeof target === 'object') {
                currentActiveStop = JSON.parse(JSON.stringify(target));
            } else {
                return;
            }

            currentCompany = currentActiveStop.company;
            selectedRoute = currentActiveStop.route;
            selectedBound = {
                bound: currentActiveStop.bound,
                serviceType: currentActiveStop.serviceType || '1',
                orig: currentActiveStop.orig || '',
                dest: currentActiveStop.dest || ''
            };

            renderActiveStopDashboard();
            fetchRealTimeETA();
            fetchStopsForSelectedRoute(true);

            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(fetchRealTimeETA, 10000);
        }

        function removeFavorite(idx) {
            favorites.splice(idx, 1);
            localStorage.setItem('hk_bus_favs', JSON.stringify(favorites));
            renderFavorites();
            updateFavButtonState();
        }

        function openSearchModal() { 
            const routeInput = document.getElementById('routeSearchInput');
            if (routeInput) routeInput.value = '';
            const dropdown = document.getElementById('routeAutocompleteDropdown');
            if (dropdown) {
                dropdown.innerHTML = '';
                dropdown.classList.add('hidden');
            }
            clearAllStopData();
            document.getElementById('busSearchModal').classList.remove('hidden'); 
            setTimeout(() => { if (routeInput) routeInput.focus(); }, 100);
        }
        
        function closeSearchModal() { document.getElementById('busSearchModal').classList.add('hidden'); }

        function openChangeStopModal() {
            if (!currentActiveStop) return;
            document.getElementById('changeStopModalSub').textContent = `${currentActiveStop.company.toUpperCase()} ${currentActiveStop.route}號線 - 共有 ${currentRouteStops.length} 個車站`;
            const sel = document.getElementById('changeStopSelect');
            sel.innerHTML = currentRouteStops.map(s => `<option value="${s.stopId}" ${s.stopId===currentActiveStop.stopId?'selected':''}>${s.seq}. ${s.name}</option>`).join('');
            
            const container = document.getElementById('changeStopListContainer');
            container.innerHTML = currentRouteStops.map(s => `
                <div onclick="selectStopFromChangeModal('${s.stopId}', '${s.name.replace(/'/g, "\\'")}', ${s.seq})" class="p-2 rounded-xl bg-slate-900 hover:bg-indigo-950/60 border border-slate-800 cursor-pointer flex items-center justify-between text-xs transition">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="w-5 h-5 rounded bg-slate-800 text-slate-300 font-bold flex items-center justify-center text-[10px] shrink-0">${s.seq}</span>
                        <span class="font-bold ${s.stopId===currentActiveStop.stopId?'text-indigo-400':'text-slate-200'} truncate">${s.name}</span>
                    </div>
                    ${s.stopId===currentActiveStop.stopId?'<span class="text-[9px] bg-indigo-900 text-indigo-200 px-1.5 py-0.5 rounded">當前</span>':''}
                </div>
            `).join('');

            document.getElementById('changeStopModal').classList.remove('hidden');
        }

        function closeChangeStopModal() { document.getElementById('changeStopModal').classList.add('hidden'); }

        function onQuickChangeStopSelect() {
            const val = document.getElementById('changeStopSelect').value;
            const found = currentRouteStops.find(s => s.stopId === val);
            if (found) selectStopFromChangeModal(found.stopId, found.name, found.seq);
        }

        function selectStopFromChangeModal(stopId, stopName, seq) {
            const foundStop = currentRouteStops.find(s => s.stopId === stopId);
            currentActiveStop.stopId = stopId;
            currentActiveStop.stopName = stopName;
            currentActiveStop.seq = seq;
            closeChangeStopModal();
            renderActiveStopDashboard();
            fetchRealTimeETA();
            updateBusMap();

            if (foundStop && foundStop.lat && foundStop.long) {
                fetchWeatherAndLocation(foundStop.lat, foundStop.long);
            }

            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(fetchRealTimeETA, 10000);
        }

        function filterChangeStops() {
            const query = document.getElementById('changeStopSearchInput').value.trim().toLowerCase();
            const container = document.getElementById('changeStopListContainer');
            const filtered = currentRouteStops.filter(s => s.name.toLowerCase().includes(query));
            container.innerHTML = filtered.map(s => `
                <div onclick="selectStopFromChangeModal('${s.stopId}', '${s.name.replace(/'/g, "\\'")}', ${s.seq})" class="p-2 rounded-xl bg-slate-900 hover:bg-indigo-950/60 border border-slate-800 cursor-pointer flex items-center justify-between text-xs transition">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="w-5 h-5 rounded bg-slate-800 text-slate-300 font-bold flex items-center justify-center text-[10px] shrink-0">${s.seq}</span>
                        <span class="font-bold ${s.stopId===currentActiveStop.stopId?'text-indigo-400':'text-slate-200'} truncate">${s.name}</span>
                    </div>
                    ${s.stopId===currentActiveStop.stopId?'<span class="text-[9px] bg-indigo-900 text-indigo-200 px-1.5 py-0.5 rounded">當前</span>':''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
