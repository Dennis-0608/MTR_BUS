<!DOCTYPE html>
<html lang="zh-HK" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>香港巴士及地鐵到站預報</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet PolylineDecorator (方向箭咀外掛) -->
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hkbus: '#0055A5',
                        hkmtr: '#A2238E',
                        kmb: '#e11d48',
                        ctb: '#eab308'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        input, select, button {
            font-size: 16px !important;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        /* Leaflet popup dark theme customization */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #0f172a !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        /* Remove default white border box on Leaflet DivIcons */
        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full h-[100dvh] flex flex-col font-sans antialiased overflow-hidden">

    <!-- App Shell Container -->
    <div class="max-w-md w-full mx-auto h-full flex flex-col p-2.5 sm:p-3 gap-2 justify-between">

        <!-- Header Block -->
        <header class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-lg flex flex-col gap-2 shrink-0">
            
            <!-- Row 1: Mode Switch & HKO Weather -->
            <div class="flex items-center justify-between gap-2">
                
                <!-- Bus / MTR Toggle -->
                <div class="bg-slate-950 p-1 rounded-xl flex items-center shrink-0 border border-slate-800">
                    <button id="btn-bus" onclick="switchMode('bus')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 text-slate-400 hover:text-white">
                        <i class="fa-solid fa-bus"></i>
                        <span>巴士</span>
                    </button>
                    <button id="btn-mtr" onclick="switchMode('mtr')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-purple-700 text-white shadow-sm">
                        <i class="fa-solid fa-train-subway"></i>
                        <span>MTR</span>
                    </button>
                </div>

                <!-- Live Weather & District Badge -->
                <div id="weather-box" onclick="fetchWeatherAndLocation()" title="點擊更新天氣資料" class="flex items-center bg-slate-950 border border-slate-800 px-2.5 py-1.5 rounded-xl gap-1.5 shrink-0 cursor-pointer hover:border-slate-700 transition">
                    <span id="weatherIcon" class="text-xl">⛅</span>
                    <span id="weatherTemp" class="font-black text-emerald-400 text-base sm:text-lg">--°C</span>
                    <span id="weatherLocation" class="font-black text-slate-100 text-base sm:text-lg">香港</span>
                    <i class="fa-solid fa-location-dot text-xs text-indigo-400" id="gpsStatusIcon"></i>
                </div>

            </div>

            <!-- Row 2: Search Buttons & Last Update Time -->
            <div id="busNavActions" class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800/80 hidden">
                <div class="flex items-center gap-1.5 flex-1">
                    <button onclick="openSearchModal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-1.5 px-2.5 rounded-xl shadow flex items-center justify-center gap-1.5 transition active:scale-95 text-xs">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>搜尋路線</span>
                    </button>
                </div>

                <div class="flex items-center gap-1 text-[10px] text-slate-400 shrink-0 ml-1">
                    <span>更新時間: </span>
                    <span id="etaRefreshTime" class="font-mono">--:--:--</span>
                    <button onclick="manualRefreshETA()" class="p-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                        <i id="refreshIcon" class="fa-solid fa-rotate-right text-[11px]"></i>
                    </button>
                </div>
            </div>

            <!-- MTR Refresh Bar -->
            <div id="mtrNavActions" class="flex items-center justify-between gap-1.5 pt-1 border-t border-slate-800/80">
                <div class="flex items-center gap-1.5 flex-1 overflow-hidden">
                    <select id="mtrLineSelect" onchange="onMtrLineChange()" class="w-1/2 max-w-[110px] bg-slate-950 border border-slate-800 text-purple-300 rounded-lg px-1.5 py-1 focus:outline-none focus:border-purple-500 text-[11px] font-bold truncate">
                    </select>
                    <select id="mtrStationSelect" onchange="onMtrStationChange()" class="w-1/2 max-w-[110px] bg-slate-950 border border-slate-800 text-purple-300 rounded-lg px-1.5 py-1 focus:outline-none focus:border-purple-500 text-[11px] font-bold truncate">
                    </select>
                </div>
                <div class="flex items-center gap-1 text-[10px] text-slate-400 shrink-0 ml-1">
                    <span>更新時間: </span>
                    <span id="mtrRefreshTime" class="font-mono">--:--:--</span>
                    <button onclick="fetchMtrETA()" class="p-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                        <i id="mtrRefreshIcon" class="fa-solid fa-rotate-right text-[11px]"></i>
                    </button>
                </div>
            </div>

        </header>

        <!-- Main Content View Container -->
        <main class="flex-1 flex flex-col gap-2 min-h-0 overflow-hidden">

            <!-- BUS VIEW CONTAINER -->
            <div id="busViewContainer" class="flex-1 flex flex-col gap-2 min-h-0 overflow-hidden hidden">
                <div id="activeStopCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col gap-1.5 shrink-0">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span id="displayCompanyTag" class="bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-wide shrink-0">九巴 (KMB)</span>
                            <span id="displayRouteSeq" class="hidden">路線 --</span>
                            <p id="displayBoundInfo" class="text-base font-bold text-indigo-400 truncate">請點擊上方的搜尋路線按鈕</p>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button id="favBtn" onclick="toggleFavorite()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 font-semibold px-2.5 py-1 rounded-xl flex items-center gap-1 transition text-xs">
                                <i id="favIcon" class="fa-regular fa-star text-xs"></i>
                                <span id="favBtnText">收藏</span>
                            </button>
                            <button id="changeStopBtn" onclick="openChangeStopModal()" class="bg-indigo-900/40 hover:bg-indigo-800/60 text-indigo-300 border border-indigo-500/40 font-semibold px-2.5 py-1 rounded-xl flex items-center gap-1 transition text-xs">
                                <i class="fa-solid fa-arrows-rotate text-xs"></i>
                                <span>換站</span>
                            </button>
                        </div>
                    </div>
                    <h2 id="displayStopName" class="text-xl sm:text-2xl font-black text-slate-100 tracking-tight truncate">
                        尚未選擇車站
                    </h2>
                </div>

                <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col overflow-y-auto no-scrollbar min-h-0 gap-3">
                    <!-- 班次預報區域 -->
                    <div id="etaListContainer" class="w-full flex flex-col gap-2 shrink-0">
                        <div class="text-center py-8 text-slate-500">
                            <i class="fa-solid fa-bus text-3xl mb-2 block text-slate-700"></i>
                            <p class="text-sm">請點擊上方「搜尋路線」選擇車站</p>
                        </div>
                    </div>

                    <!-- 地圖顯示區域 -->
                    <div id="busMapContainer" class="w-full flex-1 min-h-[220px] rounded-2xl border border-slate-800 shadow-md overflow-hidden relative bg-slate-950 z-0">
                        <div id="busMap" class="w-full h-full"></div>
                    </div>
                </div>
            </div>

            <!-- MTR VIEW CONTAINER -->
            <div id="mtrViewContainer" class="flex-1 flex flex-col gap-2 min-h-0 overflow-hidden">
                <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-lg flex flex-col overflow-hidden min-h-0">
                    
                    <div class="flex flex-col gap-2 border-b border-slate-800/80 pb-2.5 mb-2.5 shrink-0">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <i class="fa-solid fa-train-subway text-indigo-400 text-lg shrink-0"></i>
                                <h2 id="mtrDisplayStationName" class="text-lg font-black text-white truncate">請先選擇車站</h2>
                                <span id="mtrStationFavBadge" class="hidden bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0 flex items-center gap-1">
                                    <i class="fa-solid fa-star text-[9px]"></i>已收藏
                                </span>
                            </div>
                            <div id="mtrFavActionArea" class="flex items-center gap-1.5 hidden shrink-0 ml-2">
                                <button id="mtrFavBtn" onclick="toggleMtrFavorite()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-3 py-1 rounded-lg text-xs transition">
                                    收藏
                                </button>
                                <button id="mtrDelBtn" onclick="deleteMtrFavorite()" class="bg-rose-600 hover:bg-rose-700 text-white font-black px-3 py-1 rounded-lg text-xs transition hidden">
                                    刪除
                                </button>
                            </div>
                        </div>

                        <div id="mtrFilterContainer" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar hidden pt-1">
                        </div>
                    </div>

                    <div id="mtrEtaListContainer" class="flex-1 flex flex-col gap-2 overflow-y-auto no-scrollbar py-1">
                        <div class="text-center py-10 text-slate-500">
                            <i class="fa-solid fa-train-subway text-3xl mb-2 block text-slate-700"></i>
                            <p class="text-xs">請選擇路線及車站以獲取即時列車班次</p>
                        </div>
                    </div>

                </div>
            </div>

        </main>

        <!-- Favorites Footer Section -->
        <footer id="favoritesFooter" class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 shadow-lg shrink-0">
            <div class="flex items-center justify-between mb-1.5 px-0.5">
                <h3 class="text-base font-bold text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                    <span id="favFooterTitle">收藏車站</span>
                </h3>
            </div>
            
            <div class="flex items-center gap-1">
                <!-- 左滑按鈕 -->
                <button onclick="scrollFavorites('left')" class="p-1.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white transition shrink-0 active:scale-95" title="向左滾動">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>

                <!-- 收藏清單滑動區 -->
                <div id="favoritesSection" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 scroll-smooth w-full">
                    <div class="text-slate-500 text-xs py-1 px-1">
                        未有 MTR 收藏，選擇鐵路站時點擊「收藏」即可儲存
                    </div>
                </div>

                <!-- 右滑按鈕 -->
                <button onclick="scrollFavorites('right')" class="p-1.5 rounded-xl bg-slate-950 border border-slate-800 hover:border-slate-700 text-slate-300 hover:text-white transition shrink-0 active:scale-95" title="向右滾動">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </footer>

    </div>

    <!-- Modals -->
    <div id="busSearchModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[9999] flex items-center justify-center p-3 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col h-[85vh]">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-route text-indigo-400"></i>
                    <span>全港巴士站點檢索</span>
                </h3>
                <button onclick="closeSearchModal()" class="text-slate-400 hover:text-white p-1 text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-3.5 space-y-3 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">巴士公司：</label>
                    <select id="modalCompanySelect" onchange="onCompanySelectChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 text-xs">
                        <option value="kmb">九龍巴士 (KMB)</option>
                        <option value="ctb">城巴 (Citybus - CTB)</option>
                    </select>
                </div>
                <div class="relative">
                    <label class="block text-xs font-semibold text-slate-300 mb-1">選擇或輸入路線號碼：</label>
                    <div class="relative">
                        <input type="text" id="routeSearchInput" oninput="onRouteInput(event)" placeholder="輸入路線 (如: 1A, 968, A11)..." autocomplete="off" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2.5 pl-9 focus:outline-none focus:border-indigo-500 text-sm" />
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                    </div>
                    <div id="routeAutocompleteDropdown" class="absolute left-0 right-0 top-full mt-1 bg-slate-950 border border-slate-800 rounded-xl max-h-56 overflow-y-auto shadow-2xl z-[10000] hidden"></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">行車方向：</label>
                    <select id="modalBoundSelect" onchange="onBoundChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 text-xs">
                        <option value="">-- 請先選擇路線 --</option>
                    </select>
                </div>
                <div class="border-t border-slate-800 pt-2.5">
                    <label id="modalStopHeaderCount" class="block text-xs font-semibold text-slate-300 mb-1">
                        該路線全線所有停靠站點：
                    </label>
                    <select id="modalStopSelect" onchange="onStopDropdownChange()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2 mb-2 focus:outline-none focus:border-indigo-500 text-xs">
                        <option value="">-- 請先選擇路線與行車方向 --</option>
                    </select>
                    <div id="modalStopList" class="bg-slate-950 border border-slate-800 rounded-xl p-2 max-h-40 overflow-y-auto space-y-1">
                        <p class="text-xs text-slate-500 text-center py-3">請先選擇路線與方向</p>
                    </div>
                </div>
            </div>
            <div class="p-2.5 border-t border-slate-800 bg-slate-950 flex justify-end">
                <button onclick="closeSearchModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl transition text-xs">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <div id="changeStopModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[9999] flex items-center justify-center p-3 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col h-[75vh]">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-950">
                <div>
                    <h3 class="text-sm font-bold text-slate-100">更改車站</h3>
                    <p id="changeStopModalSub" class="text-[10px] text-indigo-400 mt-0.5">選擇同路線的其他車站</p>
                </div>
                <button onclick="closeChangeStopModal()" class="text-slate-400 hover:text-white p-1 text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-3 space-y-2.5 overflow-y-auto flex-1">
                <div class="relative">
                    <input type="text" id="changeStopSearchInput" oninput="filterChangeStops()" placeholder="搜尋本線車站名稱..." class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2 pl-8 focus:outline-none focus:border-indigo-500 text-xs" />
                    <i class="fa-solid fa-filter absolute left-2.5 top-2.5 text-slate-500 text-xs"></i>
                </div>
                <div>
                    <select id="changeStopSelect" onchange="onQuickChangeStopSelect()" class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 text-xs"></select>
                </div>
                <div id="changeStopListContainer" class="bg-slate-950 border border-slate-800 rounded-xl p-2 max-h-52 overflow-y-auto space-y-1"></div>
            </div>
            <div class="p-2.5 border-t border-slate-800 bg-slate-950">
                <button onclick="closeChangeStopModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl transition text-xs">
                    取消
                </button>
            </div>
        </div>
    </div>

    <script>
        const mtrData = {
            "KTL": { name: "觀塘綫", stations: [{ code: "WHA", name: "黃埔" }, { code: "HOM", name: "何文田" }, { code: "YMT", name: "油麻地" }, { code: "MOK", name: "旺角" }, { code: "PRE", name: "太子" }, { code: "SKM", name: "石硤尾" }, { code: "KOT", name: "九龍塘" }, { code: "LOF", name: "樂富" }, { code: "WTS", name: "黃大仙" }, { code: "DIH", name: "鑽石山" }, { code: "CHH", name: "彩虹" }, { code: "KOB", name: "九龍灣" }, { code: "NTK", name: "牛頭角" }, { code: "KWT", name: "觀塘" }, { code: "LAT", name: "藍田" }, { code: "YAT", name: "油塘" }, { code: "TIK", name: "調景嶺" }] },
            "ISL": { name: "港島綫", stations: [{ code: "KET", name: "堅尼地城" }, { code: "HKU", name: "香港大學" }, { code: "SYP", name: "西營盤" }, { code: "SHW", name: "上環" }, { code: "CEN", name: "中環" }, { code: "ADM", name: "金鐘" }, { code: "WAC", name: "灣仔" }, { code: "CAB", name: "銅鑼灣" }, { code: "TIH", name: "天后" }, { code: "FOH", name: "炮台山" }, { code: "NOP", name: "北角" }, { code: "QUB", name: "鰂魚涌" }, { code: "TAK", name: "太古" }, { code: "SWH", name: "西灣河" }, { code: "SKW", name: "筲箕灣" }, { code: "HFC", name: "杏花邨" }, { code: "CHW", name: "柴灣" }] },
            "TWL": { name: "荃灣綫", stations: [{ code: "CEN", name: "中環" }, { code: "ADM", name: "金鐘" }, { code: "TST", name: "尖沙咀" }, { code: "JOR", name: "佐敦" }, { code: "YMT", name: "油麻地" }, { code: "MOK", name: "旺角" }, { code: "PRE", name: "太子" }, { code: "SSP", name: "深水埗" }, { code: "CSW", name: "長沙灣" }, { code: "LCK", name: "荔枝角" }, { code: "MEF", name: "美孚" }, { code: "LAK", name: "荔景" }, { code: "KWF", name: "葵芳" }, { code: "KWT", name: "葵興" }, { code: "TWH", name: "大窩口" }, { code: "TSW", name: "荃灣" }] },

        function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function isJointRoute(routeNum) {
            if (!routeNum) return false;
            const r = String(routeNum).trim().toUpperCase();
            const jointPattern = /^(1|3|6|9|N1|N3|N6|N9|X9|H1|H2)\d{2}[A-Z]?$/;
            const existsInKmb = kmbRoutes.some(item => String(item.route).toUpperCase() === r);
            const existsInCtb = ctbRoutes.some(item => String(item.route).toUpperCase() === r);
            return jointPattern.test(r) && existsInKmb && existsInCtb;
        }

        function getTrainLimit(lineCode, stationCode, dir, trains) {
            const linesForStation = stationToLinesMap.get(stationCode) || [];
            const isInterchange = linesForStation.length > 1;

            const lineTermini = {
                "KTL": ["WHA", "TIK"],
                "ISL": ["KET", "CHW"],
                "TWL": ["CEN", "TSW"],
                "SIL": ["ADM", "SOH"],
                "TCL": ["HOK", "TUC"],
                "EAL": ["ADM", "LOW", "LMC"],
                "TML": ["WKS", "TUM"],
                "TKL": ["NOP", "POA", "LHP"],
                "AEL": ["HOK", "AWE"],
                "DRL": ["SUN", "DIS"]
            };

            const isTerminus = (lineTermini[lineCode] || []).includes(stationCode);

            if (!isInterchange && isTerminus) {
                return 4;
            }

            if (stationCode === 'SUN' && lineCode === 'DRL') {
                return 4;
            }

            if (stationCode === 'HOK' && lineCode === 'TCL') {
                return 4;
            }

            if (stationCode === 'HOK' && lineCode === 'AEL') {
                return 4;
            }

            if (stationCode === 'CEN' && lineCode === 'TWL') {
                return 4;
            }

            if (stationCode === 'ADM' && lineCode === 'SIL') {
                if (dir === 'UP' || trains.some(t => t.dest === 'SOH')) return 4;
            }

            if (stationCode === 'ADM' && lineCode === 'EAL') {
                if (dir === 'UP' || trains.some(t => ['LOW', 'LMC', 'TAP', 'SHT', 'FOT', 'UNI', 'TWO', 'FAN', 'SHS'].includes(t.dest))) return 4;
            }

            if (stationCode === 'TIK' && lineCode === 'KTL') {
                if (dir === 'DOWN' || trains.some(t => ['WHA', 'HOM', 'YMT', 'MOK'].includes(t.dest))) return 4;
            }

            if (stationCode === 'NOP' && lineCode === 'TKL') {
                if (dir === 'DOWN' || trains.some(t => ['POA', 'LHP', 'TKO'].includes(t.dest))) return 4;
            }

            return 2;
        }

        async function fetchMtrETA() {
            if (!selectedMtrStation) return;
            const container = document.getElementById('mtrEtaListContainer');
            const icon = document.getElementById('mtrRefreshIcon');
            const timeEl = document.getElementById('mtrRefreshTime');

            if (icon) icon.classList.add('fa-spin');
            timeEl.textContent = new Date().toLocaleTimeString('zh-HK', { hour12: false });

            let activeLines = (selectedMtrFilterLine !== 'ALL') ? [selectedMtrFilterLine] : (stationToLinesMap.get(selectedMtrStation) || (selectedMtrLine ? [selectedMtrLine] : []));

            if (activeLines.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">請選擇車站</div>`;
                if (icon) icon.classList.remove('fa-spin');
                return;
            }

            try {
                const fetchPromises = activeLines.map(lineCode =>
                    fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${lineCode}&sta=${selectedMtrStation}`)
                        .then(res => res.ok ? res.json() : null)
                        .then(data => ({ lineCode, data }))
                        .catch(() => ({ lineCode, data: null }))
                );

                const results = await Promise.all(fetchPromises);
                let finalTrainList = [];
                const now = new Date();

                results.forEach(({ lineCode, data }) => {
                    if (!data || data.status === 0 || !data.data) return;
                    const key = `${lineCode}-${selectedMtrStation}`;
                    const scheduleData = data.data[key];
                    if (!scheduleData) return;

                    const upTrains = (scheduleData.UP || []).map(t => ({ ...t, lineCode, dir: 'UP' }));
                    const downTrains = (scheduleData.DOWN || []).map(t => ({ ...t, lineCode, dir: 'DOWN' }));

                    const processDirection = (trains, dirName) => {
                        let valid = [];
                        trains.forEach(t => {
                            if (t.time) {
                                const arrivalTime = new Date(t.time.replace(/-/g, '/'));
                                const diffSec = Math.floor((arrivalTime - now) / 1000);
                                if (diffSec >= -30) valid.push({ ...t, diffSec, arrivalTime });
                            }
                        });
                        valid.sort((a, b) => a.arrivalTime - b.arrivalTime);
                        const limit = getTrainLimit(lineCode, selectedMtrStation, dirName, valid);
                        return valid.slice(0, limit);
                    };

                    finalTrainList.push(...processDirection(upTrains, 'UP'), ...processDirection(downTrains, 'DOWN'));
                });

                finalTrainList.sort((a, b) => a.arrivalTime - b.arrivalTime);

                if (finalTrainList.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-amber-400 text-xs font-bold">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>
                            <p>暫無列車到站資訊或非服務時間</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = finalTrainList.map(t => {
                    const destName = mtrStationNames[t.dest] || t.dest;
                    const plat = t.plat || '1';
                    const lineName = mtrData[t.lineCode] ? mtrData[t.lineCode].name : t.lineCode;
                    const lineColor = mtrLineColors[t.lineCode] || '#6b7280';
                    const diffSec = t.diffSec;
                    let minutesLeft = Math.max(0, Math.floor(diffSec / 60));
                    let statusText = `${minutesLeft} 分鐘`;
                    let isSpecialState = false;

                    if (diffSec > 0 && diffSec <= 60) {
                        statusText = "即將到達";
                        isSpecialState = true;
                    } else if (diffSec <= 0 && diffSec >= -30) {
                        statusText = "正在離開";
                        isSpecialState = true;
                    }

                    return `

        async function fetchWeatherAndLocation(overrideLat = null, overrideLng = null) {
            const gpsIcon = document.getElementById('gpsStatusIcon');
            const locEl = document.getElementById('weatherLocation');
            const tempEl = document.getElementById('weatherTemp');
            const iconEl = document.getElementById('weatherIcon');
            const weatherBox = document.getElementById('weather-box');

            if (gpsIcon) gpsIcon.className = "fa-solid fa-spinner fa-spin text-xs text-amber-400";
            let userCoords = null;

            if ("geolocation" in navigator) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { 
                            timeout: 5000, 
                            maximumAge: 30000, 
                            enableHighAccuracy: true 
                        });
                    });
                    userCoords = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };
                    if (gpsIcon) gpsIcon.className = "fa-solid fa-location-dot text-xs text-emerald-400";
                } catch (err) {
                    if (overrideLat && overrideLng) {
                        userCoords = { lat: overrideLat, lng: overrideLng };
                        if (gpsIcon) gpsIcon.className = "fa-solid fa-map-pin text-xs text-indigo-400";
                    } else {
                        if (gpsIcon) gpsIcon.className = "fa-solid fa-location-slash text-xs text-slate-500";
                    }
                }
            } else if (overrideLat && overrideLng) {
                userCoords = { lat: overrideLat, lng: overrideLng };
                if (gpsIcon) gpsIcon.className = "fa-solid fa-map-pin text-xs text-indigo-400";
            }

            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                if (res.ok) {
                    const data = await res.json();
                    
                    if (data.icon && data.icon.length > 0) {
                        iconEl.textContent = getHkoWeatherEmoji(data.icon[0]);
                    }

                    const tempArr = (data.temperature && data.temperature.data) ? data.temperature.data : [];
                    let selectedStationName = "香港";
                    let matchedTemp = null;

                    if (userCoords && tempArr.length > 0) {
                        let minDistance = Infinity;
                        
                        hkoStations.forEach(station => {
                            const apiData = tempArr.find(t => t.place === station.name || t.place.includes(station.name));
                            if (apiData) {
                                const dist = calculateDistanceMeters(userCoords.lat, userCoords.lng, station.lat, station.lng);
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    selectedStationName = station.name;
                                    matchedTemp = apiData.value;
                                }
                            }
                        });
                    }

                    if (matchedTemp === null) {
                        const defaultItem = tempArr.find(t => t.place === '京士柏' || t.place === '香港天文台') || tempArr[0];
                        if (defaultItem) {
                            selectedStationName = defaultItem.place;
                            matchedTemp = defaultItem.value;
                        } else {
                            selectedStationName = "香港";
                            matchedTemp = 28;
                        }
                    }

                    locEl.textContent = selectedStationName;
                    tempEl.textContent = `${matchedTemp}°C`;

                    let tooltipText = `地區: ${selectedStationName} (${matchedTemp}°C)`;
                    if (data.humidity && data.humidity.data && data.humidity.data.length > 0) {
                        tooltipText += ` | 相對濕度: ${data.humidity.data[0].value}%`;
                    }
                    if (data.warningMessage && data.warningMessage.length > 0) {
                        tooltipText += ` | 警告: ${data.warningMessage.join('; ')}`;
                    }
                    if (weatherBox) weatherBox.title = tooltipText;
                }
            } catch (err) {
                console.error("HKO Weather API fetch error:", err);
                tempEl.textContent = "28°C";
                locEl.textContent = "香港";
            }
        }

        function getHkoWeatherEmoji(code) {
            const c = Number(code);
            if (c === 50 || c === 77) return '☀️';           
            if (c === 51 || c === 52) return '⛅';           
            if (c === 53 || c === 54) return '🌦️';           
            if (c === 60 || c === 61) return '☁️';           
            if (c === 62) return '🌧️';                       
            if (c === 63 || c === 64) return '🌧️';           
            if (c === 65 || c === 85) return '⛈️';           
            if (c >= 70 && c <= 76) return '🌙';           
            if (c === 80) return '🌬️';                       
            if (c >= 81 && c <= 84) return '🌫️';           
            if (c === 90) return '🥵';                       
            if (c === 91) return '🥶';                       
            if (c >= 92 && c <= 93) return '⛈️';           
            return '⛅';
        }

        async function loadInitialBusData() {
            try {
                const kmbRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
                if (kmbRes.ok) {
                    const kmbData = await kmbRes.json();
                    kmbRoutes = kmbData.data || [];
                }
                const ctbRes = await fetch('https://rt.data.gov.hk/v2/transport/citybus/route/ctb');
                if (ctbRes.ok) {
                    const ctbData = await ctbRes.json();
                    ctbRoutes = ctbData.data || [];
                }
                buildRouteMap('kmb');
            } catch (err) {
                console.error("Failed loading routes:", err);
            }
        }

        function buildRouteMap(company) {
            routeMap.clear();
            currentCompany = company;
            const routesList = (company === 'kmb') ? kmbRoutes : ctbRoutes;
            routesList.forEach(r => {
                const routeNum = r.route;
                if (!routeMap.has(routeNum)) routeMap.set(routeNum, []);
                routeMap.get(routeNum).push(r);
            });
        }

        function onCompanySelectChange() {
            const select = document.getElementById('modalCompanySelect');
            buildRouteMap(select.value);
            document.getElementById('routeSearchInput').value = '';
            clearAllStopData();
        }

        function onRouteInput(e) {
            const query = e.target.value.trim().toUpperCase();
            const dropdown = document.getElementById('routeAutocompleteDropdown');

            if (!query) {
                dropdown.classList.add('hidden');
                clearAllStopData();
                return;
            }

            const allRoutes = Array.from(routeMap.keys()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            const matchedRoutes = allRoutes.filter(r => r.toUpperCase().startsWith(query)).slice(0, 150);

            if (matchedRoutes.length === 0) {
                dropdown.innerHTML = '<div class="p-2.5 text-xs text-slate-500 text-center">沒有找到相關路線</div>';
                dropdown.classList.remove('hidden');
                return;
            }

            dropdown.innerHTML = matchedRoutes.map(r => {
                const routeVariants = routeMap.get(r) || [];
                const firstVar = routeVariants[0] || {};
                const orig = firstVar.orig_tc || firstVar.orig_en || '';
                const dest = firstVar.dest_tc || firstVar.dest_en || '';
                const termInfo = (orig && dest) ? `${orig} ↔ ${dest}` : '';

                return `
                    <div onclick="selectRouteFromDropdown('${r}')" class="p-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800/50 flex items-center justify-between gap-2">
                        <span class="font-extrabold text-indigo-400 text-sm shrink-0">${r}</span>
                        <span class="text-xs text-slate-400 truncate text-right flex-1">${termInfo}</span>
                    </div>
                `;
            }).join('');

            dropdown.classList.remove('hidden');
        }

        function selectRouteFromDropdown(routeNum) {
            document.getElementById('routeSearchInput').value = routeNum;
            document.getElementById('routeAutocompleteDropdown').classList.add('hidden');
            selectedRoute = routeNum;
            loadBoundOptions(routeNum);
        }

        function clearAllStopData() {
            selectedBound = null;
            currentRouteStops = [];
            const boundSelect = document.getElementById('modalBoundSelect');
            if (boundSelect) boundSelect.innerHTML = '<option value="">-- 請先選擇路線 --</option>';
            const stopHeader = document.getElementById('modalStopHeaderCount');
            if (stopHeader) stopHeader.textContent = '該路線全線所有停靠站點：';
            const stopSelect = document.getElementById('modalStopSelect');

            const stopList = document.getElementById('modalStopList');

        }

        function loadBoundOptions(routeNum) {
            clearAllStopData();
            const boundSelect = document.getElementById('modalBoundSelect');
            const routeVariants = routeMap.get(routeNum) || [];

            if (routeVariants.length === 0) {
                boundSelect.innerHTML = '<option value="">-- 無效路線 --</option>';
                return;
            }

            let optionsHtml = '<option value="">-- 請選擇行車方向 --</option>';

            if (currentCompany === 'ctb') {
                routeVariants.forEach((v) => {
                    const orig = v.orig_tc || v.orig_en || '起點';
                    const dest = v.dest_tc || v.dest_en || '終點';
                    optionsHtml += `<option value="outbound" data-service="1" data-orig="${orig}" data-dest="${dest}">往 ${dest} (由 ${orig} 開出)</option>`;
                    if (orig !== dest) {
                        optionsHtml += `<option value="inbound" data-service="1" data-orig="${dest}" data-dest="${orig}">往 ${orig} (由 ${dest} 開出)</option>`;
                    }
                });
            } else {
                routeVariants.forEach((v, index) => {
                    let boundVal = v.bound;
                    if (boundVal === 'O') boundVal = 'outbound';
                    if (boundVal === 'I') boundVal = 'inbound';
                    if (!boundVal) boundVal = (index === 0) ? 'outbound' : 'inbound';

                    const orig = v.orig_tc || v.orig_en || '起點';
                    const dest = v.dest_tc || v.dest_en || '終點';
                    const serviceType = v.service_type || '1';
                    const serviceNote = (serviceType !== '1') ? ' [特別班次]' : '';
                    optionsHtml += `<option value="${boundVal}" data-service="${serviceType}" data-orig="${orig}" data-dest="${dest}">往 ${dest} (由 ${orig} 開出)${serviceNote}</option>`;
                });
            }

            boundSelect.innerHTML = optionsHtml;
        }

        async function onBoundChange() {

            const selectedOpt = boundSelect.options[boundSelect.selectedIndex];
            if (!selectedOpt || !selectedOpt.value) return;

            selectedBound = {
                bound: selectedOpt.value,

        function saveCtbStopsToLocalStorage() {
            try {
                const obj = Object.fromEntries(ctbStopsDirectory);
                localStorage.setItem('hk_ctb_stops_cache', JSON.stringify(obj));
            } catch(e) {}
        }

        async function getStopInfo(company, stopId) {
            const directory = (company === 'kmb') ? kmbStopsDirectory : ctbStopsDirectory;
            if (directory.has(stopId)) {
                return directory.get(stopId);
            }
            try {
                const url = (company === 'kmb')
                    ? `https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`
                    : `https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.data) {
                        const info = {
                            name: data.data.name_tc || data.data.name_en || stopId,
                            lat: parseFloat(data.data.lat || 0),
                            long: parseFloat(data.data.long || 0)
                        };
                        directory.set(stopId, info);
                        if (company === 'ctb') {
                            saveCtbStopsToLocalStorage();
                        }
                        return info;
                    }
                }
            } catch (e) {}

            const fallback = { name: stopId, lat: 0, long: 0 };
            directory.set(stopId, fallback);
            return fallback;
        }

        async function fetchStopsForSelectedRoute(quiet = false) {
            const stopSelect = document.getElementById('modalStopSelect');
            const stopListContainer = document.getElementById('modalStopList');
            if (!quiet) {
                stopSelect.innerHTML = '<option value="">正在下載全線車站...</option>';
                stopListContainer.innerHTML = '<div class="text-center py-4 text-xs text-indigo-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i>下載車站清單中...</div>';
            }

            currentRouteStops = [];

            try {
                let rawStops = [];
                const dirStr = (selectedBound.bound === 'inbound' || selectedBound.bound === 'I') ? 'inbound' : 'outbound';

                if (currentCompany === 'kmb') {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${selectedRoute}/${dirStr}/${selectedBound.serviceType}`);
                    if (res.ok) {
                        const data = await res.json();
                        rawStops = data.data || [];
                    }
                } else {
                    const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${selectedRoute}/${dirStr}`);
                    if (res.ok) {
                        const data = await res.json();
                        rawStops = data.data || [];
                    }
                }

                if (rawStops.length === 0) {
                    if (!quiet) {
                        stopSelect.innerHTML = '<option value="">找不到車站資料</option>';
                        stopListContainer.innerHTML = '<p class="text-xs text-rose-400 text-center py-3">此方向暫無車站資料</p>';
                    }
                    return;
                }

                for (let i = 0; i < rawStops.length; i++) {
                    const st = rawStops[i];
                    const stopId = st.stop;
                    const stopInfo = await getStopInfo(currentCompany, stopId);
                    currentRouteStops.push({ seq: i + 1, stopId: stopId, name: stopInfo.name, lat: stopInfo.lat, long: stopInfo.long });
                }

                if (!quiet) {
                    document.getElementById('modalStopHeaderCount').textContent = `該路線全線所有停靠站點 (共 ${currentRouteStops.length} 個)：`;
                    stopSelect.innerHTML = '<option value="">-- 請直接選擇車站 --</option>' + currentRouteStops.map(s => `<option value="${s.stopId}">${s.seq}. ${s.name}</option>`).join('');

                    stopListContainer.innerHTML = currentRouteStops.map(s => `
                        <div onclick="selectStopAndClose('${s.stopId}', '${s.name.replace(/'/g, "\\'")}', ${s.seq})" class="p-2 rounded-xl bg-slate-900 hover:bg-indigo-950/60 border border-slate-800 cursor-pointer flex items-center justify-between text-xs transition">
                            <div class="flex items-center gap-2 overflow-hidden">
                                <span class="w-5 h-5 rounded bg-slate-800 text-slate-300 font-bold flex items-center justify-center text-[10px] shrink-0">${s.seq}</span>
                                <span class="font-bold text-slate-200 truncate">${s.name}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        </div>
                    `).join('');
                }

                updateBusMap();

            } catch (err) {
                console.error("Failed fetching stops:", err);
                if (!quiet) {
                    stopSelect.innerHTML = '<option value="">下載車站失敗</option>';
                    stopListContainer.innerHTML = '<p class="text-xs text-rose-400 text-center py-3">下載失敗，請重試</p>';
                }
            }
        }

        async function fetchCoCompanyData(route, bound, seq, currentComp) {
            const coComp = (currentComp === 'kmb') ? 'ctb' : 'kmb';

            try {
                let outStops = [], inStops = [];

                if (coComp === 'kmb') {
                    const [resOut, resIn] = await Promise.all([
                        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/outbound/1`),
                        fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route}/inbound/1`)
                    ]);
                    if (resOut.ok) { const d = await resOut.json(); outStops = d.data || []; }
                    if (resIn.ok) { const d = await resIn.json(); inStops = d.data || []; }
                } else {
                    const [resOut, resIn] = await Promise.all([
                        fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${route}/outbound`),
                        fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/ctb/${route}/inbound`)
                    ]);
                    if (resOut.ok) { const d = await resOut.json(); outStops = d.data || []; }
                    if (resIn.ok) { const d = await resIn.json(); inStops = d.data || []; }
                }

                if (outStops.length === 0 && inStops.length === 0) return null;

                const primaryDest = (currentActiveStop ? (currentActiveStop.dest || '') : '').trim();

                async function getTerminusName(stopsList) {
                    if (!stopsList || stopsList.length === 0) return '';
                    const lastStopId = stopsList[stopsList.length - 1].stop;
                    const info = await getStopInfo(coComp, lastStopId);
                    return info.name || '';
                }

                const [outDestName, inDestName] = await Promise.all([
                    getTerminusName(outStops),
                    getTerminusName(inStops)
                ]);

                function calcSimilarity(str1, str2) {
                    if (!str1 || !str2) return 0;
                    let match = 0;
                    for (let char of str1) {
                        if (char !== ' ' && str2.includes(char)) match++;
                    }
                    return match;
                }

                const outScore = calcSimilarity(primaryDest, outDestName);
                const inScore = calcSimilarity(primaryDest, inDestName);

                let targetCoStops = outStops;
                let targetCoDir = 'outbound';

                if (inScore > outScore && inStops.length > 0) {
                    targetCoStops = inStops;
                    targetCoDir = 'inbound';
                } else if (outStops.length > 0) {
                    targetCoStops = outStops;
                    targetCoDir = 'outbound';
                } else {
                    targetCoStops = inStops;
                    targetCoDir = 'inbound';
                }

                const activeStopInfo = await getStopInfo(currentComp, currentActiveStop.stopId);
                const coStopsInfoList = await Promise.all(
                    targetCoStops.map(async (st, idx) => {
                        const info = await getStopInfo(coComp, st.stop);
                        return {
                            seq: idx + 1,
                            stopId: st.stop,
                            name: info.name,
                            lat: info.lat,
                            long: info.long
                        };
                    })
                );

                let bestMatchedStop = null;

                if (activeStopInfo.lat && activeStopInfo.long) {
                    let minDistance = Infinity;
                    let closestStop = null;

                    for (let st of coStopsInfoList) {
                        if (st.lat && st.long) {
                            const dist = calculateDistanceMeters(activeStopInfo.lat, activeStopInfo.long, st.lat, st.long);
                            if (dist < minDistance) {
                                minDistance = dist;
                                closestStop = st;
                            }
                        }
                    }

                    if (closestStop && minDistance <= 350) {
                        bestMatchedStop = closestStop;
                    }
                }

                if (!bestMatchedStop) {
                    const cleanName = (str) => str.replace(/(轉車站|巴士總站|轉乘站|收費廣場|BBI|（.*）|\(.*\))/g, '').trim();
                    const cleanedCurrent = cleanName(activeStopInfo.name || currentActiveStop.stopName || '');

                    for (let st of coStopsInfoList) {
                        const cleanedCo = cleanName(st.name);
                        if (cleanedCurrent && cleanedCo && (cleanedCurrent.includes(cleanedCo) || cleanedCo.includes(cleanedCurrent))) {
                            bestMatchedStop = st;
                            break;
                        }
                    }
                }

                if (!bestMatchedStop && coStopsInfoList.length > 0) {
                    const ratio = (seq - 1) / Math.max(1, (currentActiveStop.totalStops || 1) - 1);
                    const targetIdx = Math.min(Math.round(ratio * (coStopsInfoList.length - 1)), coStopsInfoList.length - 1);
                    bestMatchedStop = coStopsInfoList[targetIdx];
                }

                if (!bestMatchedStop) return null;

                let coEtas = [];
                const coApiDir = (targetCoDir === 'inbound' || targetCoDir === 'I') ? 'I' : 'O';

                if (coComp === 'kmb') {
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${bestMatchedStop.stopId}`);
                    if (res.ok) {
                        const data = await res.json();
                        const list = data.data || [];
                        coEtas = list.filter(item => String(item.route) === String(route) && String(item.dir) === coApiDir);
                    }
                } else {
                    const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${bestMatchedStop.stopId}/${route}`);
                    if (res.ok) {
                        const data = await res.json();
                        const list = data.data || [];
                        coEtas = list.filter(item => {
                            let itemDir = item.dir;
                            if (itemDir === 'O') itemDir = 'outbound';
                            if (itemDir === 'I') itemDir = 'inbound';
                            return itemDir.toLowerCase() === targetCoDir.toLowerCase();
                        });
                    }
                }

                return {
                    coComp: coComp,
                    coStopId: bestMatchedStop.stopId,
                    coStopName: bestMatchedStop.name,
                    coSeq: bestMatchedStop.seq,
                    etas: coEtas
                };
            } catch (err) {
                console.error("Co-company fetch error:", err);
                return null;
            }
        }

        async function fetchRealTimeETA() {
            if (!currentActiveStop) return;

            const container = document.getElementById('etaListContainer');
            const refreshTimeEl = document.getElementById('etaRefreshTime');
            const now = new Date();
            const nowMs = now.getTime();
            refreshTimeEl.textContent = now.toLocaleTimeString('zh-HK', { hour12: false });

            const isJoint = isJointRoute(currentActiveStop.route);

            try {
                let primaryEtas = [];
                const targetDir = (currentActiveStop.bound === 'inbound' || currentActiveStop.bound === 'I') ? 'I' : 'O';

                const fetchPrimaryPromise = (async () => {
                    if (currentActiveStop.company === 'kmb') {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${currentActiveStop.stopId}`);
                        if (res.ok) {
                            const data = await res.json();
                            const list = data.data || [];
                            const targetServiceType = String(currentActiveStop.serviceType || '1');
                            
                            primaryEtas = list.filter(item => 
                                String(item.route) === String(currentActiveStop.route) && 
                                String(item.dir) === targetDir && 
                                String(item.service_type) === targetServiceType
                            );

                            if (primaryEtas.length === 0) {
                                primaryEtas = list.filter(item => 
                                    String(item.route) === String(currentActiveStop.route) && 
                                    String(item.dir) === targetDir
                                );
                            }
                        }
                    } else {
                        const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/${currentActiveStop.stopId}/${currentActiveStop.route}`);
                        if (res.ok) {
                            const data = await res.json();
                            const list = data.data || [];
                            primaryEtas = list.filter(item => {
                                let itemDir = item.dir;
                                if (itemDir === 'O') itemDir = 'outbound';
                                if (itemDir === 'I') itemDir = 'inbound';
                                return itemDir.toLowerCase() === currentActiveStop.bound.toLowerCase() || true;
                            });
                        }
                    }
                })();

                let coCompanyResult = null;
                if (isJoint) {
                    coCompanyResult = await fetchCoCompanyData(currentActiveStop.route, currentActiveStop.bound, currentActiveStop.seq, currentActiveStop.company);
                }

                await fetchPrimaryPromise;

                let mergedEtas = [];

                primaryEtas.forEach((item) => {
                    if (!item.eta) return;
                    const etaMs = new Date(item.eta).getTime();
                    const diffMs = etaMs - nowMs;
                    const diffSec = Math.floor(diffMs / 1000);

                    if (diffSec >= -30) {
                        mergedEtas.push({
                            ...item,
                            company: currentActiveStop.company,
                            diffSec,
                            diffMs
                        });
                    }
                });

                if (isJoint && coCompanyResult && coCompanyResult.etas) {
                    coCompanyResult.etas.forEach((item) => {
                        if (!item.eta) return;
                        const etaMs = new Date(item.eta).getTime();
                        const diffMs = etaMs - nowMs;
                        const diffSec = Math.floor(diffMs / 1000);

                        if (diffSec >= -30) {
                            mergedEtas.push({
                                ...item,
                                company: coCompanyResult.coComp,
                                diffSec,
                                diffMs
                            });
                        }
                    });
                }

                const seenEtaKeys = new Set();
                const uniqueMergedEtas = [];
                for (const item of mergedEtas) {
                    const etaKey = `${item.company}_${item.eta}`;
                    if (!seenEtaKeys.has(etaKey)) {
                        seenEtaKeys.add(etaKey);
                        uniqueMergedEtas.push(item);
                    }
                }

                uniqueMergedEtas.sort((a, b) => a.diffMs - b.diffMs);

                let htmlContent = '';

                if (uniqueMergedEtas.length === 0) {
                    htmlContent = `
                        <div class="text-center py-6 text-slate-500">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block text-amber-500"></i>
                            <p class="text-sm font-bold text-slate-300">暫時沒有此方向的即時班次資料</p>
                        </div>
                    `;
                } else {
                    const top3Etas = uniqueMergedEtas.slice(0, 3);
                    
                    htmlContent += `<div class="grid grid-cols-3 gap-2 w-full">`;
                    
                    for (let idx = 0; idx < 3; idx++) {
                        const item = top3Etas[idx];
                        if (item) {
                            const etaTimeStr = new Date(item.eta).toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
                            const diffSec = item.diffSec;
                            const diffMins = Math.max(0, Math.floor(item.diffMs / 60000));

                            const isKmb = item.company === 'kmb';
                            const compBadgeClass = isKmb 
                                ? 'bg-rose-600 text-white' 
                                : 'bg-amber-500 text-slate-950';
                            const compName = isKmb ? '九巴' : '城巴';

                            let timeBadge = `<span class="text-[22px] sm:text-[26px] font-black text-emerald-400">${diffMins} <span class="text-[14px] font-normal text-slate-400">分鐘</span></span>`;
                            
                            if (diffSec <= 0 && diffSec >= -30) {
                                timeBadge = `<span class="text-[18px] sm:text-[20px] font-black text-amber-400">正在離開</span>`;
                            } else if (diffSec > 0 && diffSec <= 60) {
                                timeBadge = `<span class="text-[18px] sm:text-[20px] font-black text-amber-400">即將到達</span>`;
                            }

                            htmlContent += `
                                <div class="bg-slate-950 border border-slate-800 rounded-xl p-2 flex flex-col items-center justify-between text-center shadow-sm min-h-[92px]">
                                    <span class="${compBadgeClass} text-[9px] font-black px-1.5 py-0.5 rounded tracking-wide shrink-0">
                                        ${compName}
                                    </span>
                                    <div class="my-0.5 flex items-center justify-center">${timeBadge}</div>
                                    <div class="text-[12px] text-slate-400 font-mono">${etaTimeStr}</div>
                                </div>
                            `;
                        } else {
                            htmlContent += `
                                <div class="bg-slate-950/50 border border-slate-800/50 rounded-xl p-2 flex flex-col items-center justify-center text-center text-slate-600 min-h-[92px]">
                                    <div class="text-sm font-bold text-slate-600">--</div>
                                </div>
                            `;
                        }
                    }

                    htmlContent += `</div>`;
                }

                container.innerHTML = htmlContent;

            } catch (err) {
                console.error("ETA Fetch error:", err);
                container.innerHTML = `<div class="text-center py-6 text-rose-400 text-xs"><i class="fa-solid fa-triangle-exclamation mb-1 text-base"></i><p>載入即時預報失敗，請點擊更新按鈕重試</p></div>`;
            }
        }

        function selectStopFromMap(stopId, stopName, seq) {
            if (!currentActiveStop) return;
            if (currentActiveStop.stopId === stopId) return;

            const foundStop = currentRouteStops.find(s => s.stopId === stopId);
            currentActiveStop.stopId = stopId;
            currentActiveStop.stopName = stopName;
            currentActiveStop.seq = seq;

            renderActiveStopDashboard();
            fetchRealTimeETA();
            updateBusMap();

            if (foundStop && foundStop.lat && foundStop.long) {
                fetchWeatherAndLocation(foundStop.lat, foundStop.long);
            }

            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(fetchRealTimeETA, 10000);
        }

        function jumpToStopBySeq(targetSeq) {
            if (!currentRouteStops || currentRouteStops.length === 0) return;
            const targetStop = currentRouteStops.find(s => s.seq === targetSeq);
            if (targetStop) {
                selectStopFromMap(targetStop.stopId, targetStop.name, targetStop.seq);
            }
        }

        function updateBusMap() {
            if (!currentActiveStop) return;

            const mapEl = document.getElementById('busMap');
            if (!mapEl) return;

            if (!busMap) {
                busMap = L.map('busMap', { zoomControl: false }).setView([22.3193, 114.1694], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap & data.gov.hk'
                }).addTo(busMap);
                L.control.zoom({ position: 'bottomright' }).addTo(busMap);
                mapMarkersGroup = L.layerGroup().addTo(busMap);
            }

            setTimeout(() => { busMap.invalidateSize(); }, 200);

            mapMarkersGroup.clearLayers();
            
            if (mapPolyline) {
                busMap.removeLayer(mapPolyline);
                mapPolyline = null;
            }
            if (mapDecorator) {
                busMap.removeLayer(mapDecorator);
                mapDecorator = null;
            }

            const latLngs = [];
            let currentStopLatLng = null;

            const activePinIcon = L.divIcon({
                className: 'custom-map-pin-active',
                html: `
                    <div class="relative flex items-center justify-center">
                        <i class="fa-solid fa-location-dot text-rose-600 text-3xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]"></i>
                        <div class="absolute w-2 h-2 bg-white rounded-full -mt-2"></div>
                    </div>
                `,
                iconSize: [30, 36],
                iconAnchor: [15, 36],
                popupAnchor: [0, -36]
            });

            const defaultPinIcon = L.divIcon({
                className: 'custom-map-pin-default',
                html: `
                    <div class="relative flex items-center justify-center opacity-85 hover:opacity-100 transition cursor-pointer">
                        <i class="fa-solid fa-location-dot text-blue-500 text-xl drop-shadow-[0_1px_3px_rgba(0,0,0,0.5)]"></i>
                        <div class="absolute w-1.5 h-1.5 bg-white rounded-full -mt-1"></div>
                    </div>
                `,
                iconSize: [22, 26],
                iconAnchor: [11, 26],
                popupAnchor: [0, -26]
            });

            currentRouteStops.forEach((st) => {
                if (st.lat && st.long && st.lat > 0 && st.long > 0) {
                    const isCurrent = (st.stopId === currentActiveStop.stopId);
                    const point = [st.lat, st.long];
                    latLngs.push(point);

                    const hasPrev = st.seq > 1;
                    const hasNext = st.seq < currentRouteStops.length;

                    const navButtonsHtml = `
                        <div style="margin-top: 6px; display: flex; gap: 6px; justify-content: center; align-items: center;">
                            ${hasPrev 
                                ? `<button onclick="jumpToStopBySeq(${st.seq - 1})" style="background: #3b82f6; color: white; border: none; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">上一站</button>`
                                : `<button disabled style="background: #334155; color: #64748b; border: none; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: not-allowed;">上一站</button>`
                            }
                            ${hasNext 
                                ? `<button onclick="jumpToStopBySeq(${st.seq + 1})" style="background: #3b82f6; color: white; border: none; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">下一站</button>`
                                : `<button disabled style="background: #334155; color: #64748b; border: none; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: not-allowed;">下一站</button>`
                            }
                        </div>
                    `;

                    const popupContent = `
                        <div style="font-weight:bold; font-size:15px; color:#ffffff; text-align:center;">
                            ${st.seq}. ${st.name}
                            ${navButtonsHtml}
                        </div>
                    `;

                    if (isCurrent) {
                        currentStopLatLng = point;
                        const redMarker = L.marker(point, { icon: activePinIcon })
                            .bindPopup(popupContent);
                        
                        mapMarkersGroup.addLayer(redMarker);
                        redMarker.openPopup();
                    } else {
                        const stopMarker = L.marker(point, { icon: defaultPinIcon })
                            .bindPopup(popupContent);
                        
                        stopMarker.on('click', function() {
                            selectStopFromMap(st.stopId, st.name, st.seq);
                        });

                        mapMarkersGroup.addLayer(stopMarker);
                    }
                }
            });

            if (latLngs.length > 1) {
                const lineThemeColor = (currentActiveStop.company === 'ctb') ? '#eab308' : '#e11d48';

                // 1. 快速先畫出基礎參考線條
                mapPolyline = L.polyline(latLngs, {
                    color: lineThemeColor,
                    weight: 4,
                    opacity: 0.7
                }).addTo(busMap);

                if (typeof L.polylineDecorator === 'function') {
                    mapDecorator = L.polylineDecorator(mapPolyline, {
                        patterns: [
                            {
                                offset: '8%',
                                repeat: 45,
                                symbol: L.Symbol.arrowHead({
                                    pixelSize: 8,
                                    polygon: false,
                                    pathOptions: { stroke: true, color: '#ffffff', weight: 2, opacity: 0.95 }
                                })
                            }
                        ]
                    }).addTo(busMap);
                }

                if (currentStopLatLng) {
                    busMap.setView(currentStopLatLng, 15);
                } else {
                    busMap.fitBounds(mapPolyline.getBounds(), { padding: [25, 25] });
                }

                // 2. 異步載入真實道路駕駛軌跡（經專精 AI 高手防偏離算法優化）
                fetchRouteRoadTrajectory(currentRouteStops, currentActiveStop.company);
            } else if (currentStopLatLng) {
                busMap.setView(currentStopLatLng, 15);
            }
        }

        // 同步城巴/九巴真實道路軌跡專用 API 函數（防偏離加強版）
        async function fetchRouteRoadTrajectory(stops, company) {
            const validStops = stops.filter(s => s.lat > 0 && s.long > 0);
            if (validStops.length < 2) return;

            const chunkSize = 8; // 縮小批次規模，防止單點偏離拉扯後續數十個車站
            let fullRoadCoords = [];

            try {
                for (let i = 0; i < validStops.length - 1; i += chunkSize - 1) {
                    const chunk = validStops.slice(i, i + chunkSize);
                    if (chunk.length < 2) continue;

                    const locs = chunk.map(s => `${s.long},${s.lat}`).join(';');
                    // 加入 radiuses=100m 自動吸附主幹道，配合 continue_straight=true 禁止 180 度大掉頭
                    const radiuses = chunk.map(() => '100').join(';');
                    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${locs}?overview=full&geometries=geojson&continue_straight=true&radiuses=${radiuses}`;

                    const res = await fetch(osrmUrl);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.routes && data.routes.length > 0) {
                            const routeData = data.routes[0];
                            const coords = routeData.geometry.coordinates; // [[lng, lat], ...]
                            
                            // 計算該小段車站間的直線距離總和
                            let directDist = 0;
                            for (let k = 0; k < chunk.length - 1; k++) {
                                directDist += calculateDistanceMeters(chunk[k].lat, chunk[k].long, chunk[k+1].lat, chunk[k+1].long);
                            }

                            const osrmDist = routeData.distance || 0;

                            // 繞路防禦機制：如果 OSRM 計算距離大於兩站直線總和 2.2 倍，代表觸發偏離繞路，降級改用直線連接
                            if (osrmDist > 0 && directDist > 0 && osrmDist > directDist * 2.2) {
                                const fallbackCoords = chunk.map(s => [s.lat, s.long]);
                                if (fullRoadCoords.length > 0) fullRoadCoords.pop();
                                fullRoadCoords = fullRoadCoords.concat(fallbackCoords);
                            } else {
                                const latLngs = coords.map(c => [c[1], c[0]]);
                                if (fullRoadCoords.length > 0) fullRoadCoords.pop();
                                fullRoadCoords = fullRoadCoords.concat(latLngs);
                            }
                        }
                    } else {
                        // API 失敗時降級連線
                        const fallbackCoords = chunk.map(s => [s.lat, s.long]);
                        if (fullRoadCoords.length > 0) fullRoadCoords.pop();
                        fullRoadCoords = fullRoadCoords.concat(fallbackCoords);
                    }
                }

                if (fullRoadCoords.length > 1 && mapPolyline) {
                    busMap.removeLayer(mapPolyline);
                    if (mapDecorator) {
                        busMap.removeLayer(mapDecorator);
                    }

                    const polyColor = (company === 'ctb') ? '#eab308' : '#e11d48';

                    mapPolyline = L.polyline(fullRoadCoords, {
                        color: polyColor,
                        weight: 5,
                        opacity: 0.95
                    }).addTo(busMap);

                    if (typeof L.polylineDecorator === 'function') {
                        mapDecorator = L.polylineDecorator(mapPolyline, {
                            patterns: [
                                {
                                    offset: '5%',
                                    repeat: 40,
                                    symbol: L.Symbol.arrowHead({
                                        pixelSize: 8,
                                        polygon: false,
                                        pathOptions: { stroke: true, color: '#ffffff', weight: 2, opacity: 0.95 }
                                    })
                                }
                            ]
                        }).addTo(busMap);
                    }
                }
            } catch (err) {
                console.warn("無法取得真實道路軌跡，維持基礎直線預覽:", err);
            }
        }

        function manualRefreshETA() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('fa-spin');
            fetchRealTimeETA().finally(() => {
                setTimeout(() => { if (icon) icon.classList.remove('fa-spin'); }, 500);
            });
        }

            if (!currentActiveStop) return;
            const index = favorites.findIndex(f => f.company === currentActiveStop.company && f.route === currentActiveStop.route && f.stopId === currentActiveStop.stopId);
            if (index >= 0) {
                favorites.splice(index, 1);
            } else {
                favorites.push({ ...currentActiveStop });
            }
            localStorage.setItem('hk_bus_favs', JSON.stringify(favorites));
            renderFavorites();
            updateFavButtonState();
        }
